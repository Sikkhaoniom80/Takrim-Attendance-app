<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%;max-width:480px}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%;max-width:480px}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.pad-bn{font-size:11.5px!important;font-weight:700!important;color:#0f2d5a!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.pad-en{font-size:9px!important;font-weight:700!important;color:#cc0000!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.filter-tabs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
#studentList{display:none!important}
#studentList.show{display:block!important}
#resultDiv{display:none}
.pa{padding:8px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.a-on{background:#f44336;color:#fff}
.a-ok{background:#16a34a;color:#fff}
table.mtbl{border-collapse:collapse;font-size:11px}
table.mtbl th,table.mtbl td{border:1px solid #ccc;padding:4px 6px;text-align:center}
</style>
</head>
<body>
<div class="header" style="padding-bottom:20px">
<div class="college-pad"><img id="boxLogo3"><div style="flex:1;overflow:hidden"><div id="boxNameBn3" class="pad-bn"></div><div id="boxNameEn3" class="pad-en"></div><div style="font-size:10px;color:#333"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div></div></div>
<h2 style="margin:10px 0 0">শিক্ষার্থীর তালিকা</h2>
<div style="color:#ffcc00;font-size:13px;margin-top:6px;font-weight:700">শ্রেণী: <span id="showClass3"></span></div>
<button onclick="location.href='dashboard.html'" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold;cursor:pointer">ড্যাশবোর্ড</button>
</div>
<script>
(function(){
try{
var ci=null;
var keys=['collegeInfo','clgInfo','college','takrim_collegeInfo','college_info','takrim_college'];
for(var x=0;x<keys.length;x++){try{var v=JSON.parse(localStorage.getItem(keys[x])||'null');if(v&&(v.nameBn||v.name||v.eiin)){ci=v;break;}}catch(e){}}
if(!ci)ci={};
var logo=ci.logo||ci.logoUrl||'';
document.getElementById('boxNameBn3').innerText=ci.nameBn||ci.name||'প্রতিষ্ঠান';
document.getElementById('boxNameEn3').innerText=ci.nameEn||ci.name_en||'';
document.getElementById('boxEIIN3').innerText='EIIN: '+(ci.eiin||ci.EIIN||'-');
document.getElementById('boxIns3').innerText='Code: '+(ci.ins||ci.code||'-');
if(logo)document.getElementById('boxLogo3').src=logo;
var cls=localStorage.getItem('takrim_current_class')||localStorage.getItem('takrim_current')||localStorage.getItem('currentClass')||localStorage.getItem('takrim_class')||localStorage.getItem('selectedClass')||'';
document.getElementById('showClass3').innerText=cls;
window._takrimCLS=cls;
}catch(e){document.getElementById('boxNameBn3').innerText='প্রতিষ্ঠান';}
})();
</script>
<div class="card">
<button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold;cursor:pointer">শিক্ষার্থী যোগ করুন (+)</button>
<div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a">
<input type="text" id="sName" placeholder="নাম">
<input type="text" id="sRoll" placeholder="রোল">
<input type="text" id="sMobile" placeholder="মোবাইল">
<div style="display:flex;gap:8px">
<button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer">যোগ করুন</button>
<button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px;cursor:pointer">বন্ধ</button>
</div>
</div>
<div onclick="document.getElementById('ocrInput').click()" style="border:2px dashed #7c3aed;border-radius:12px;padding:14px;text-align:center;margin-top:10px;cursor:pointer;background:#f5f3ff">
<b style="font-size:16px">AI দিয়ে একসাথে যোগ করুন</b><br>
<small style="color:#666">কাগজের লিস্টের ছবি তুলুন / গ্যালারি থেকে নিন</small>
</div>
<input type="file" id="ocrInput" accept="image/*" style="display:none" onchange="ocrStart(this)">
<div id="ocrStatus" style="text-align:center;margin-top:8px;font-size:14px;color:#0f2d5a"></div>
<div id="ocrTableWrap" style="display:none;margin-top:10px">
<p style="font-size:13px;color:#666">পড়া তথ্য মিলিয়ে নিন:</p>
<div style="overflow:auto">
<table style="width:100%;border-collapse:collapse;font-size:13px">
<tr style="background:#0f3d2e;color:#fff"><th style="padding:6px">নাম</th><th style="padding:6px">রোল</th><th style="padding:6px">মোবাইল</th><th></th></tr>
<tbody id="ocrRows"></tbody>
</table>
</div>
<button onclick="ocrSaveAll()" style="width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px;background:#16a34a;color:#fff">সব সেভ করুন</button>
</div>
<div class="filter-tabs">
<button style="background:#ffcc00" onclick="filterList('all')">সবাই<br><span id="cAll">0</span></button>
<button style="background:#16a34a;color:white" onclick="filterList('present')">উপস্থিত<br><span id="cPresent">0</span></button>
<button style="background:#ef4444;color:white" onclick="filterList('absent')">অনুপস্থিত<br><span id="cAbsent">0</span></button>
<button style="background:#7c3aed;color:white" onclick="filterList('result')">ফলাফল</button>
</div>
<div id="studentList"></div>
<div id="resultDiv" style="overflow:auto;margin-top:10px;border:2px solid #7c3aed;border-radius:12px;padding:10px;background:#f5f3ff"></div>
</div>
<script>
var GEMINI_API_KEY=localStorage.getItem('takrim_gemini_key')||'';
function getGeminiKey(){
  if(!GEMINI_API_KEY){
    var k=prompt('প্রথমবার: Gemini API Key দিন (একবারই লাগবে):');
    if(k&&k.trim()){GEMINI_API_KEY=k.trim();localStorage.setItem('takrim_gemini_key',GEMINI_API_KEY);}
  }
  return GEMINI_API_KEY;
}
var currentClass=window._takrimCLS||localStorage.getItem('takrim_current_class')||localStorage.getItem('takrim_current')||'';
var students=[];
var attendance={};
var attMonthly={};
var results={};
var subCount=13;
var subFull=[];
var subNames=[];
(function(){for(var i=0;i<13;i++){subNames.push('বিষয় '+(i+1));}})();
var currentFilter='none';
function key(n){return n+'_'+currentClass;}
function getJSON(k,def){try{var v=localStorage.getItem(k);if(v===null||v===undefined)return def;return JSON.parse(v);}catch(e){return def;}}
function loadClassData(){
  students=getJSON(key('students'),[]);
  attendance=getJSON(key('att'),{});
  attMonthly=getJSON(key('attMonthly'),{});
  results=getJSON(key('results'),{});
  var sn=getJSON(key('subNames'),null);
  if(sn&&sn.length)subNames=sn;
  var sc=parseInt(localStorage.getItem(key('subCount'))||'13',10);
  subCount=(sc>=1&&sc<=20)?sc:13;
  while(subNames.length<subCount)subNames.push('বিষয় '+(subNames.length+1));
  var sf=getJSON(key('subFull'),[]);
  subFull=[];
  for(var i=0;i<20;i++)subFull.push(sf[i]||100);
}
function saveAll(){
  if(!currentClass)return;
  localStorage.setItem(key('students'),JSON.stringify(students));
  localStorage.setItem(key('att'),JSON.stringify(attendance));
  localStorage.setItem(key('attMonthly'),JSON.stringify(attMonthly));
  localStorage.setItem(key('results'),JSON.stringify(results));
  localStorage.setItem(key('subFull'),JSON.stringify(subFull));
  localStorage.setItem(key('subCount'),String(subCount));
  localStorage.setItem(key('subNames'),JSON.stringify(subNames));
}
function getMonthInfo(){var d=new Date();return{key:d.getFullYear()+'-'+d.getMonth(),today:d.getDate()};}
function toggleAdd(){var f=document.getElementById('addForm');f.style.display=(f.style.display==='none')?'block':'none';}
function addStudent(){
  var nEl=document.getElementById('sName');
  if(!nEl.value.trim()){alert('নাম দিন');return;}
  students.push({name:nEl.value.trim(),roll:document.getElementById('sRoll').value.trim(),mobile:document.getElementById('sMobile').value.trim()});
  saveAll();
  document.getElementById('addForm').style.display='none';
  nEl.value='';document.getElementById('sRoll').value='';document.getElementById('sMobile').value='';
  filterList('all');
}
function shiftObj(o,i){var n={};for(var k in o){k=+k;if(k<i)n[k]=o[k];else if(k>i)n[k-1]=o[k];}return n;}
function delStudent(i){
  if(!confirm('ডিলিট করবেন?'))return;
  students.splice(i,1);
  attendance=shiftObj(attendance,i);
  var nm={};
  for(var mk in attMonthly)nm[mk]=shiftObj(attMonthly[mk],i);
  attMonthly=nm;
  results=shiftObj(results,i);
  saveAll();render();updateCounts();
}
function editStudent(i){
  var s=students[i];
  var n=prompt('নাম:',s.name);if(n===null)return;
  var r=prompt('রোল:',s.roll||'');if(r===null)return;
  var m=prompt('মোবাইল:',s.mobile||'');if(m===null)return;
  students[i]={name:n.trim()||s.name,roll:r.trim(),mobile:m.trim()};
  saveAll();render();updateCounts();
}
function toggleAtt(i,isP){
  attendance[i]=isP?'present':'absent';
  var mi=getMonthInfo();
  if(!attMonthly[mi.key])attMonthly[mi.key]={};
  if(!attMonthly[mi.key][i])attMonthly[mi.key][i]={};
  attMonthly[mi.key][i][mi.today]=isP?'P':'A';
  saveAll();render();updateCounts();
}
function updateCounts(){
  var p=0;
  for(var i=0;i<students.length;i++)if(attendance[i]!=='absent')p++;
  document.getElementById('cAll').innerText=students.length;
  document.getElementById('cPresent').innerText=p;
  document.getElementById('cAbsent').innerText=students.length-p;
}
function filterList(t){
  currentFilter=t;
  var sl=document.getElementById('studentList');
  var rd=document.getElementById('resultDiv');
  sl.classList.remove('show');
  if(t==='result'){sl.style.display='none';rd.style.display='block';renderResult();}
  else{rd.style.display='none';sl.style.display='block';sl.classList.add('show');render();}
}
function render(){
  var sl=document.getElementById('studentList');
  var h='';
  for(var i=0;i<students.length;i++){
    var s=students[i];
    if(currentFilter==='present'&&attendance[i]==='absent')continue;
    if(currentFilter==='absent'&&attendance[i]!=='absent')continue;
    var isA=attendance[i]==='absent';
    h+='<div class="student-row"><div><b>'+s.name+'</b><br><small>রোল: '+(s.roll||'-')+' | '+(s.mobile||'-')+'</small></div><div style="display:flex;gap:6px">';
    h+='<button class="pa '+(!isA?'a-ok':'')+'" onclick="toggleAtt('+i+',true)">OK</button>';
    h+='<button class="pa '+(isA?'a-on':'')+'" onclick="toggleAtt('+i+',false)">X</button>';
    h+='<button class="pa" style="background:#ffcc00" onclick="editStudent('+i+')">E</button>';
    h+='<button class="pa a-on" onclick="delStudent('+i+')">D</button>';
    h+='</div></div>';
  }
  if(!students.length)h='<p style="text-align:center;color:#888">কোনো শিক্ষার্থী নেই</p>';
  sl.innerHTML=h;
  updateCounts();
}
try{loadClassData();}catch(e){}
updateCounts();
</script>
<script>
function grade(p){if(p>=80)return 'A+';if(p>=70)return 'A';if(p>=60)return 'A-';if(p>=50)return 'B';if(p>=60)return 'A-';if(p>=50)return 'B';if(p>=40)return 'C';if(p>=33)return 'D';return 'F';}
function gpaOf(p){if(p>=80)return 5;if(p>=70)return 4;if(p>=60)return 3.5;if(p>=50)return 3;if(p>=40)return 2;if(p>=33)return 1;return 0;}
function activeSubs(){return subNames.slice(0,subCount);}
function setSubFull(si,v){subFull[si]=Math.max(1,parseInt(v,10)||100);saveAll();renderResult();}
function setAllFull(v){var n=Math.max(1,parseInt(v,10)||100);for(var k=0;k<subCount;k++)subFull[k]=n;saveAll();renderResult();}
function setSubCount(v){var n=parseInt(v,10);if(!(n>=1&&n<=20))n=13;subCount=n;while(subNames.length<subCount)subNames.push('বিষয় '+(subNames.length+1));while(subFull.length<subCount)subFull.push(100);saveAll();renderResult();}
function setSubName(si,v){subNames[si]=v.trim()||('বিষয় '+(si+1));saveAll();renderResult();}
function saveMark(i,si,v){if(!results[i])results[i]={};results[i][si]=v;saveAll();renderResult();}
function editSubs(){
  var v=prompt('বিষয়ের নাম কমা দিয়ে লিখুন:',activeSubs().join(','));
  if(!v)return;
  var a=v.split(',');
  for(var k=0;k<subCount;k++){var nm=(a[k]||'').trim();subNames[k]=nm||('বিষয় '+(k+1));}
  saveAll();renderResult();
}
function renderResult(){
  var subs=activeSubs();
  var h='<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap">';
  h+='<button class="pa" style="background:#7c3aed;color:#fff" onclick="editSubs()">নাম বদলান</button>';
  h+='<label style="font-size:13px;font-weight:bold">বিষয়: <input type="number" value="'+subCount+'" min="1" max="20" style="width:56px;padding:6px;margin:0;text-align:center" onchange="setSubCount(this.value)"></label>';
  h+='<input id="allFullInp" type="number" value="100" min="1" max="200" style="width:56px;padding:6px;margin:0;text-align:center">';
  h+='<button class="pa" style="background:#0ea5e9;color:#fff" onclick="setAllFull(this.previousElementSibling.value)">পূর্ণমান সেট</button>';
  h+='<button class="pa" style="background:#16a34a;color:#fff" onclick="downloadResultExcel()">এক্সেল</button></div>';
  h+='<div style="overflow:auto"><table class="mtbl"><tr><th>ক্রম</th><th>নাম</th><th>রোল</th>';
  for(var si=0;si<subs.length;si++){
    h+='<th><input value="'+String(subs[si]).split('"').join('&quot;')+'" style="width:64px;padding:4px;margin:0;text-align:center;font-size:11px;font-weight:bold" onchange="setSubName('+si+',this.value)"></th>';
  }
  h+='<th>প্রাপ্ত</th><th>%</th><th>গ্রেড</th><th>জিপিএ</th></tr><tr><td></td><td></td><td>পূর্ণমান</td>';
  for(var sj=0;sj<subs.length;sj++){
    h+='<td><input type="number" value="'+(subFull[sj]||100)+'" min="1" max="200" style="width:52px;padding:4px;margin:0;text-align:center;background:#fef9c3" onchange="setSubFull('+sj+',this.value)"></td>';
  }
  h+='<td colspan="4"></td></tr>';
  for(var i=0;i<students.length;i++){
    var s=students[i];
    var r=results[i]||{};
    var tot=0,ft=0,gs=0,gc=0,fail=false;
    h+='<tr><td><b>'+(i+1)+'</b></td><td style="text-align:left;white-space:nowrap">'+s.name+'</td><td>'+(s.roll||'-')+'</td>';
    for(var sk=0;sk<subs.length;sk++){
      var fm=subFull[sk]||100;
      var raw=r[sk];
      var en=(raw!==undefined&&raw!==null&&raw!=='');
      var vv=en?+raw:0;
      tot+=vv;
      if(en){ft+=fm;var gp=gpaOf(fm?vv/fm*100:0);gs+=gp;gc++;if(gp===0)fail=true;}
      h+='<td><input type="number" min="0" value="'+(en?raw:'')+'" style="width:52px;padding:4px;margin:0;text-align:center" onchange="saveMark('+i+','+sk+',this.value)"></td>';
    }
    var per=ft?tot/ft*100:0;
    var gpa=gc?gs/gc:0;
    if(fail)gpa=0;
    h+='<td><b>'+tot+'</b></td><td>'+per.toFixed(1)+'</td><td><b>'+(fail?'F':grade(per))+'</b></td><td><b>'+gpa.toFixed(2)+'</b></td></tr>';
  }
  h+='</table></div>';
  document.getElementById('resultDiv').innerHTML=h;
}
function downloadResultExcel(){
  var subs=activeSubs();
  var used=[];
  for(var a=0;a<subs.length;a++){for(var b=0;b<students.length;b++){var rw=(results[b]||{})[a];if(rw!==undefined&&rw!==null&&rw!==''){used.push(a);break;}}}
  if(!used.length){alert('নম্বর দেওয়া হয়নি');return;}
  var info=getJSON('collegeInfo',{});
  var data=[[(info.nameBn||'')+' | '+currentClass],['ফলাফল']];
  var head=['ক্রম','নাম','রোল'];
  for(var c=0;c<used.length;c++)head.push(subs[used[c]]);
  head.push('প্রাপ্ত','মোট','%','গ্রেড','জিপিএ');
  data.push(head);
  var fr=['','','পূর্ণমান'];
  var fall=0;
  for(var d=0;d<used.length;d++){var fmm=subFull[used[d]]||100;fall+=fmm;fr.push(fmm);}
  fr.push('',fall,'','','');
  data.push(fr);
  for(var i=0;i<students.length;i++){
    var s=students[i],r=results[i]||{};
    var tot=0,ft=0,gs=0,gc=0,fail=false;
    var row=[i+1,s.name,s.roll||''];
    for(var e=0;e<used.length;e++){
      var sx=used[e],fm2=subFull[sx]||100,raw2=r[sx];
      var en2=(raw2!==undefined&&raw2!==null&&raw2!=='');
      var v2=en2?+raw2:0;
      tot+=v2;
      if(en2){ft+=fm2;var gp2=gpaOf(fm2?v2/fm2*100:0);gs+=gp2;gc++;if(gp2===0)fail=true;}
      row.push(en2?v2:'');
    }
    var per=ft?tot/ft*100:0,gpa=gc?gs/gc:0;
    if(fail)gpa=0;
    row.push(tot,ft,per.toFixed(1),fail?'F':grade(per),gpa.toFixed(2));
    data.push(row);
  }
  var ws=XLSX.utils.aoa_to_sheet(data);
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'ফলাফল');
  XLSX.writeFile(wb,'result_'+currentClass+'.xlsx');
}
</script>
<script>
function fileToBase64(file){
  return new Promise(function(res,rej){
    var img=new Image();
    img.onload=function(){
      var max=1600,w=img.width,hh=img.height;
      if(w>max||hh>max){var rt=Math.min(max/w,max/hh);w=Math.round(w*rt);hh=Math.round(hh*rt);}
      var cv=document.createElement('canvas');cv.width=w;cv.height=hh;
      cv.getContext('2d').drawImage(img,0,0,w,hh);
      var d=cv.toDataURL('image/jpeg',0.85);
      res(d.substring(d.indexOf(',')+1));
    };
    img.onerror=function(){rej(new Error('ছবি খোলা যায়নি'));};
    img.src=URL.createObjectURL(file);
  });
}
function ocrStart(inp){
  var f=inp.files[0];
  if(!f)return;
  inp.value='';
  var gk=getGeminiKey();
  if(!gk){document.getElementById('ocrStatus').innerHTML='API Key দিন';return;}
  document.getElementById('ocrStatus').innerHTML='AI পড়ছে... অপেক্ষা করুন';
  document.getElementById('ocrTableWrap').style.display='none';
  fileToBase64(f).then(function(b64){
    var ptxt='Extract student list as JSON array only. Items: name, roll, mobile. Bengali digits to English.';
    var body={contents:[{parts:[{text:ptxt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}]};
    var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+gk;
    function attempt(n){
      return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}).then(function(j){
        if(j.error){
          var em=String((j.error&&j.error.message)||'');
          var busy=(em.indexOf('high demand')>=0||em.indexOf('overloaded')>=0||em.indexOf('UNAVAILABLE')>=0);
          if(busy&&n<3){
            document.getElementById('ocrStatus').innerHTML='সার্ভার ব্যস্ত, আবার চেষ্টা করছি... ('+n+'/3)';
            return new Promise(function(res){setTimeout(function(){res(attempt(n+1));},8000);});
          }
          throw new Error(j.error.message||'API সমস্যা');
        }
        return j;
      });
    }
    return attempt(1);
  }).then(function(j){
    var txt=j.candidates[0].content.parts[0].text;
    var a=txt.indexOf('['),b=txt.lastIndexOf(']');
    if(a<0||b<=a)throw new Error('JSON পাওয়া যায়নি');
    var rows=JSON.parse(txt.substring(a,b+1));
    if(!rows.length)throw new Error('খালি');
    document.getElementById('ocrStatus').innerHTML=rows.length+' জন পাওয়া গেছে';
    var h='';
    for(var q=0;q<rows.length;q++){
      var rr=rows[q]||{};
      h+='<tr><td style="border:1px solid #ccc;padding:4px"><input value="'+String(rr.name||'').split('"').join('&quot;')+'" style="width:100%;border:none;padding:6px"></td>';
      h+='<td style="border:1px solid #ccc;padding:4px"><input value="'+String(rr.roll||'').split('"').join('&quot;')+'" style="width:100%;border:none;padding:6px"></td>';
      h+='<td style="border:1px solid #ccc;padding:4px"><input value="'+String(rr.mobile||'').split('"').join('&quot;')+'" style="width:100%;border:none;padding:6px"></td>';
      h+='<td style="border:1px solid #ccc;text-align:center"><button onclick="this.parentNode.parentNode.remove()" style="border:none;background:#fee2e2;border-radius:6px;padding:6px">X</button></td></tr>';
    }
    document.getElementById('ocrRows').innerHTML=h;
    document.getElementById('ocrTableWrap').style.display='block';
  }).catch(function(e){
    document.getElementById('ocrStatus').innerHTML='পড়া যায়নি: '+e.message;
  });
}
function ocrSaveAll(){
  var rows=document.querySelectorAll('#ocrRows tr');
  var added=0;
  for(var k=0;k<rows.length;k++){
    var inp=rows[k].querySelectorAll('input');
    var nm=inp[0].value.trim(),rl=inp[1].value.trim(),mb=inp[2].value.trim();
    if(!nm&&!rl&&!mb)continue;
    students.push({name:nm,roll:rl,mobile:mb});
    added++;
  }
  saveAll();
  document.getElementById('ocrTableWrap').style.display='none';
  document.getElementById('ocrStatus').innerHTML='';
  alert(added+' জন সেভ হয়েছে!');
  filterList('all');
}
</script>
