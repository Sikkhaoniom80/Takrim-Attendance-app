<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>শিক্ষার্থীর তালিকা</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%;max-width:480px}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%;max-width:480px}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.pad-bn{font-size:11.5px!important;font-weight:700!important;color:#0f2d5a!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.pad-en{font-size:9px!important;font-weight:700!important;color:#cc0000!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.filter-tabs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
#studentList{display:none!important}#studentList.show{display:block!important}
#resultDiv{display:none}
.pa{padding:8px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.a-on{background:#f44336;color:#fff}
.a-ok{background:#16a34a;color:#fff}
table.mtbl{border-collapse:collapse;font-size:11px}
table.mtbl th,table.mtbl td{border:1px solid #ccc;padding:4px 6px;text-align:center}
</style>
</head>
<body>
<div class="header" style="padding-bottom:20px"><div class="college-pad"><img id="boxLogo3"><div style="flex:1;overflow:hidden"><div id="boxNameBn3" class="pad-bn"></div><div id="boxNameEn3" class="pad-en"></div><div style="font-size:10px;color:#333"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div></div></div>
<h2 style="margin:10px 0 0">শিক্ষার্থীর তালিকা</h2><div style="color:#ffcc00;font-size:13px;margin-top:6px;font-weight:700">শ্রেণী: <span id="showClass3"></span></div>
<button onclick="location.href='dashboard.html'" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold;cursor:pointer">⬅️ ড্যাশবোর্ড</button></div>
<div class="card">
<button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold;cursor:pointer">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a"><input type="text" id="sName" placeholder="নাম"><input type="text" id="sRoll" placeholder="রোল"><input type="text" id="sMobile" placeholder="মোবাইল"><div style="display:flex;gap:8px"><button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer">✅ যোগ</button><button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px;cursor:pointer">❌ বন্ধ</button></div></div>
<!-- ===== 📷 ছবি দিয়ে বাল্ক এন্ট্রি ===== -->
<div onclick="document.getElementById('ocrInput').click()" style="border:2px dashed #7c3aed;border-radius:12px;padding:14px;text-align:center;margin-top:10px;cursor:pointer;background:#f5f3ff">
<b style="font-size:16px">📷 ছবি দিয়ে একসাথে যোগ করুন</b><br>
<small style="color:#666">কাগজের লিস্টের ছবি তুলুন / গ্যালারি থেকে নিন — ৩০-৪০ জন একবারে</small>
</div>
<input type="file" id="ocrInput" accept="image/*" style="display:none" onchange="ocrStart(this)">
<div id="ocrStatus" style="text-align:center;margin-top:8px;font-size:14px;color:#0f2d5a"></div>
<div id="ocrTableWrap" style="display:none;margin-top:10px">
<p style="font-size:13px;color:#666">👀 পড়া তথ্য মিলিয়ে নিন, ভুল থাকলে ঠিক করুন:</p>
<div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:13px">
<tr style="background:#0f3d2e;color:#fff"><th style="padding:6px">নাম</th><th style="padding:6px">রোল</th><th style="padding:6px">মোবাইল</th><th></th></tr>
<tbody id="ocrRows"></tbody>
</table></div>
<button onclick="ocrSaveAll()" style="width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px;background:#16a34a;color:#fff">✔️ সব সেভ করুন</button>
</div>
<!-- ===== /বাল্ক এন্ট্রি ===== -->
<div class="filter-tabs"><button style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><span id="cAll">0</span></button><button style="background:#16a34a;color:white" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent">0</span></button><button style="background:#ef4444;color:white" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent">0</span></button><button style="background:#7c3aed;color:white" onclick="filterList('result')">🏆 ফলাফল</button></div>
<div id="studentList"></div><div id="resultDiv" style="overflow:auto;margin-top:10px;border:2px solid #7c3aed;border-radius:12px;padding:10px;background:#f5f3ff"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
let currentClass=localStorage.getItem('takrim_current_class')||localStorage.getItem('takrim_current')||'';
let students=[],attendance={},attMonthly={},results={};
let subNames=["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"];
let currentFilter='none';
function key(n){return n+'_'+currentClass;}
function loadClassData(){students=JSON.parse(localStorage.getItem(key('students'))||'[]');attendance=JSON.parse(localStorage.getItem(key('att'))||'{}');attMonthly=JSON.parse(localStorage.getItem(key('attMonthly'))||'{}');results=JSON.parse(localStorage.getItem(key('results'))||'{}');subNames=JSON.parse(localStorage.getItem(key('subNames'))||'["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"]');}
function saveAll(){if(!currentClass)return;localStorage.setItem(key('students'),JSON.stringify(students));localStorage.setItem(key('att'),JSON.stringify(attendance));localStorage.setItem(key('attMonthly'),JSON.stringify(attMonthly));localStorage.setItem(key('results'),JSON.stringify(results));localStorage.setItem(key('subNames'),JSON.stringify(subNames));}
function getMonthInfo(){let d=new Date();let y=d.getFullYear(),m=d.getMonth();return{monthName:d.toLocaleString('bn-BD',{month:'long',year:'numeric'}),days:new Date(y,m+1,0).getDate(),key:y+'-'+m,today:d.getDate()};}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');boxNameBn3.innerText=info.nameBn||'প্রতিষ্ঠান';boxNameEn3.innerText=info.nameEn||'';boxEIIN3.innerText='EIIN: '+(info.eiin||'-');boxIns3.innerText='Code: '+(info.ins||'-');if(info.logo)boxLogo3.src=info.logo;showClass3.innerText=currentClass;}
function toggleAdd(){let f=document.getElementById('addForm');f.style.display=f.style.display=='none'?'block':'none';}
function addStudent(){if(!sName.value.trim())return alert('নাম দিন');students.push({name:sName.value.trim(),roll:sRoll.value.trim(),mobile:sMobile.value.trim()});saveAll();document.getElementById('addForm').style.display='none';sName.value='';sRoll.value='';sMobile.value='';filterList('all');}
function delStudent(i){if(!confirm('ডিলিট করবেন?'))return;students.splice(i,1);let na={};Object.keys(attendance).forEach(k=>{k=+k;if(k<i)na[k]=attendance[k];else if(k>i)na[k-1]=attendance[k];});attendance=na;let nm={};Object.keys(attMonthly).forEach(mk=>{let t={};Object.keys(attMonthly[mk]).forEach(k=>{k=+k;if(k<i)t[k]=attMonthly[mk][k];else if(k>i)t[k-1]=attMonthly[mk][k];});nm[mk]=t;});attMonthly=nm;let nr={};Object.keys(results).forEach(k=>{k=+k;if(k<i)nr[k]=results[k];else if(k>i)nr[k-1]=results[k];});results=nr;saveAll();render();updateCounts();}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent';let mi=getMonthInfo();if(!attMonthly[mi.key])attMonthly[mi.key]={};if(!attMonthly[mi.key][i])attMonthly[mi.key][i]={};attMonthly[mi.key][i][mi.today]=isP?'P':'A';saveAll();render();updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});document.getElementById('cAll').innerText=students.length;document.getElementById('cPresent').innerText=p;document.getElementById('cAbsent').innerText=students.length-p;}
function filterList(t){currentFilter=t;let sl=document.getElementById('studentList'),rd=document.getElementById('resultDiv');sl.style.display='none';rd.style.display='none';sl.classList.remove('show');if(t=='result'){rd.style.display='block';renderResult();}else{sl.style.display='block';sl.classList.add('show');render();}}
function render(){let sl=document.getElementById('studentList');sl.innerHTML='';students.forEach((s,i)=>{if(currentFilter=='present'&&attendance[i]=='absent')return;if(currentFilter=='absent'&&attendance[i]!='absent')return;let isA=attendance[i]=='absent';sl.innerHTML+='<div class="student-row"><div><b>'+s.name+'</b><br><small>রোল: '+(s.roll||'-')+' | 📱 '+(s.mobile||'-')+'</small></div><div style="display:flex;gap:6px"><button class="pa '+(!isA?'a-ok':'')+'" onclick="toggleAtt('+i+',true)">✅</button><button class="pa '+(isA?'a-on':'')+'" onclick="toggleAtt('+i+',false)">❌</button><button class="pa a-on" onclick="delStudent('+i+')">🗑️</button></div></div>';});if(!students.length)sl.innerHTML='<p style="text-align:center;color:#888">কোনো শিক্ষার্থী নেই</p>';updateCounts();}
function grade(p){return p>=80?'A+':p>=70?'A':p>=60?'A-':p>=50?'B':p>=40?'C':p>=33?'D':'F';}
function renderResult(){let h='<button class="pa" style="background:#7c3aed;color:#fff;margin-bottom:8px" onclick="editSubs()">✏️ বিষয়ের নাম বদলান</button><div style="overflow:auto"><table class="mtbl"><tr><th>ক্রম</th><th>নাম</th><th>রোল</th>';subNames.forEach(sn=>{h+='<th>'+sn+'</th>';});h+='<th>মোট</th><th>%</th><th>গ্রেড</th></tr>';students.forEach((s,i)=>{let r=results[i]||{};let tot=0;h+='<tr><td><b>'+(i+1)+'</b></td><td style="text-align:left;white-space:nowrap">'+s.name+'</td><td>'+(s.roll||'-')+'</td>';subNames.forEach((sn,si)=>{let v=r[si]||'';tot+=+v||0;h+='<td><input type="number" min="0" max="100" value="'+v+'" style="width:52px;padding:4px;margin:0;text-align:center" onchange="saveMark('+i+','+si+',this.value)"></td>';});let per=subNames.length?tot/(subNames.length*100)*100:0;h+='<td><b>'+tot+'</b></td><td>'+per.toFixed(1)+'</td><td>'+grade(per)+'</td></tr>';});h+='</table></div>';document.getElementById('resultDiv').innerHTML=h;}
function saveMark(i,si,v){if(!results[i])results[i]={};results[i][si]=v;saveAll();renderResult();}
function editSubs(){let v=prompt('বিষয়ের নাম কমা দিয়ে লিখুন:',subNames.join(','));if(!v)return;let a=v.split(',').map(x=>x.trim()).filter(x=>x);if(a.length){subNames=a;saveAll();renderResult();}}
/* ===== 📷 OCR বাল্ক এন্ট্রি ===== */
function bn2en(s){return (s||'').replace(/[০-৯]/g,d=>('০১২৩৪৫৬৭৮৯'.indexOf(d)));}
function ocrStart(inp){
let f=inp.files[0];if(!f)return;
ocrStatus.innerHTML='⏳ ছবি পড়া হচ্ছে... একটু অপেক্ষা করুন';
ocrTableWrap.style.display='none';ocrRows.innerHTML='';
Tesseract.recognize(f,'ben+eng',{logger:m=>{if(m.status=='recognizing text')ocrStatus.innerHTML='⏳ পড়া হচ্ছে... '+Math.round((m.progress||0)*100)+'%';}})
.then(res=>{ocrParse(res.data.text);})
.catch(e=>{ocrStatus.innerHTML='❌ পড়া যায়নি, আবার চেষ্টা করুন';});
inp.value='';}
function ocrParse(text){
let lines=text.split('\n').map(l=>l.trim()).filter(l=>l.length>1);
let rows=[];
lines.forEach(ln=>{
let t=bn2en(ln);
let mob=(t.match(/01[3-9]\d{8}/)||[''])[0];
let rest=t.replace(mob,'');
let nums=(rest.match(/\d{1,4}/g)||[]);
let roll=nums.length?nums[0]:'';
let name=rest.replace(/\d+/g,'').replace(/[.,;:|_\-\(\)\[\]]/g,' ').replace(/\s+/g,' ').trim();
if(name.length>=2||mob||roll)rows.push({name:name,roll:roll,mobile:mob});});
if(!rows.length){ocrStatus.innerHTML='❌ কোনো তথ্য পাওয়া যায়নি — স্পষ্ট ছবি তুলুন';return;}
ocrStatus.innerHTML='✔️ '+rows.length+' জনের তথ্য পাওয়া গেছে';
ocrRows.innerHTML=rows.map((r,i)=>'<tr>'
+'<td style="border:1px solid #ccc;padding:4px"><input value="'+r.name.replace(/"/g,'&quot;')+'" style="width:100%;border:none;font-size:13px;padding:6px"></td>'
+'<td style="border:1px solid #ccc;padding:4px"><input value="'+r.roll+'" style="width:100%;border:none;font-size:13px;padding:6px"></td>'
+'<td style="border:1px solid #ccc;padding:4px"><input value="'+r.mobile+'" style="width:100%;border:none;font-size:13px;padding:6px"></td>'
+'<td style="border:1px solid #ccc;text-align:center"><button onclick="this.closest(\'tr\').remove()" style="border:none;background:#fee2e2;border-radius:6px;padding:6px">❌</button></td></tr>').join('');
ocrTableWrap.style.display='block';}
function ocrSaveAll(){
let added=0;
document.querySelectorAll('#ocrRows tr').forEach(tr=>{
let inp=tr.querySelectorAll('input');
let name=inp[0].value.trim(),roll=inp[1].value.trim(),mob=inp[2].value.trim();
if(!name&&!roll&&!mob)return;
students.push({name:name,roll:roll,mobile:mob});added++;});
saveAll();
ocrTableWrap.style.display='none';ocrStatus.innerHTML='';
alert('✔️ '+added+' জন সেভ হয়েছে!');
filterList('all');}
/* ===== /OCR ===== */
loadClassData();loadBox();updateCounts();
document.getElementById('studentList').style.display='none';document.getElementById('studentList').classList.remove('show');document.getElementById('resultDiv').style.display='none';currentFilter='none';
</script>
</body>
</html>
