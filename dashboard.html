<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard - Textile FINAL FIXED</title><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#f0f4f8;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}.hidden{display:none!important}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}.btn2{padding:8px 10px;border:none;border-radius:20px;color:#fff;cursor:pointer;margin:3px;font-weight:bold;font-size:11px}.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}.header3{display:flex;gap:6px;width:100%}.hbox{flex:1;padding:14px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:13px;cursor:pointer;border:3px solid transparent}.hbox.active{border-color:yellow}.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;border-radius:12px 12px 0 0}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.fifty{display:flex;gap:6px}.fifty>*{flex:1}.subName{width:90px;padding:8px 6px;border-radius:6px;border:1.5px solid #0f5d1a;background:#e8f5e9;text-align:center;font-weight:700}.subFull{width:70px;padding:7px;border-radius:6px;border:1.5px solid #b7791f;background:#fffbeb;text-align:center;font-weight:700}.markGol{width:70px;height:38px;border-radius:6px;border:1.5px solid #94a3b8;background:#fff;text-align:center;font-weight:700}.tbl{width:100%;border-collapse:collapse;font-size:12px;text-align:center;background:#fff}.tbl th{background:#0f5d1a;color:#fff;padding:10px 4px}.tbl td{padding:4px;border:1px solid #e2e8f0}#institutePadFull{width:100%;max-width:800px;background:#fff;border:1px solid #ccc;overflow:hidden}.padTop{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff}.padLogo{width:95px;height:95px;border-radius:50%;border:3px solid #0a2a7a;object-fit:cover;flex-shrink:0;background:#fff}.padText{flex:1;text-align:center;line-height:1.2;overflow:hidden;min-width:0}.bnName{font-weight:700;color:#1a237e;font-size:17px;white-space:nowrap;display:block;width:100%;overflow:hidden}.enName{font-weight:700;color:#b71c1c;font-size:13.5px;white-space:nowrap;display:block;width:100%;overflow:hidden;text-transform:uppercase}.bnAddr{font-size:13px;color:#000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line4{font-size:11px;color:#000;white-space:nowrap}.line5{font-size:11px;color:#000;white-space:nowrap}.blueLine{width:100%;height:2px;background:#0d2a7a}.classPillWrap{width:100%;display:flex;justify-content:center;padding:5px 0 8px 0;background:#fff}.classPill{background:#0d2a7a;color:#fff;padding:5px 12px;border-radius:0 0 12px 12px;font-size:11px;font-weight:700;white-space:nowrap}@media(max-width:500px){.padLogo{width:75px;height:75px}}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}</style></head><body>
<div id="secondPageWrap" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div id="institutePadFull"><div class="padTop"><img id="padLogo" class="padLogo" src=""><div class="padText"><div id="instName" class="bnName"></div><div id="instEng" class="enName"></div><div id="instAddr" class="bnAddr"></div><div class="line4">Code: <span id="padCode"></span> | Mobile: <span id="padMobile"></span></div><div class="line5">Email: <span id="padEmail"></span></div></div></div><div class="blueLine"></div><div class="classPillWrap"><div class="classPill">ট্রেড: <span id="pillTrade"></span> | শাখা: <span id="pillBranch"></span> | <span id="pillSem"></span> | সেশন: <span id="pillSession"></span></div></div></div>
<div style="text-align:center;margin-top:8px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px">🚪 লগআউট</button> <button onclick="window.location.href='index.html'" style="background:#0d47a1;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px">🏠 হোম</button></div>
<div id="acc" style="width:100%;max-width:430px;margin-top:10px"></div></div>
<script>
// ✅ FIX: প্রত্যেক সেমিস্টার আলাদা
let sessFix = JSON.parse(localStorage.getItem('takrim_session')||'null');
let baseKey = "default";
if(sessFix){
  let code = sessFix.loginCode || sessFix.inst?.schoolCode || sessFix.inst?.eiin || "noCode";
  let trade = sessFix.trade || sessFix.cls || "";
  let branch = sessFix.branch || sessFix.section || "";
  let sem = sessFix.semester || sessFix.shift || "";
  let sessionYear = sessFix.session || "";
  baseKey = `${code}_${trade}_${branch}_${sem}_${sessionYear}`.replace(/\s+/g,'_');
}
let STUDENT_KEY = "students_v2_" + baseKey;
let MONTHLY_KEY = "monthly_att_" + baseKey;
let RESULT_KEY = "fullResultSheet_" + baseKey;
let NOTICE_KEY = "notice_" + baseKey;

let students=JSON.parse(localStorage.getItem(STUDENT_KEY)||'[]');let saved=JSON.parse(localStorage.getItem(RESULT_KEY)||'null');let activeTab='';
function autoFit(id,max,min){let el=document.getElementById(id); if(!el) return; let size=max; el.style.fontSize=size+'px'; let parentW=el.parentElement.clientWidth; while(el.scrollWidth > parentW && size > min){ size -= 0.5; el.style.fontSize=size+'px'; }}
function showSecondPage(){
  let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!sess){window.location.href='index.html';return;}
  document.getElementById('instName').innerText=sess.inst.bnName||'';
  document.getElementById('instEng').innerText=sess.inst.enName||'';
  document.getElementById('instAddr').innerText=sess.inst.addr||'উত্তর বাড্ডা, ঢাকা-১২১২';
  let logoEl=document.getElementById('padLogo');if(sess.inst.logo)logoEl.src=sess.inst.logo;
  document.getElementById('padCode').innerText=sess.inst.schoolCode||sess.inst.eiin||sess.loginCode||'';
  document.getElementById('padMobile').innerText=sess.inst.mobile||'';
  document.getElementById('padEmail').innerText=sess.inst.email||'';
  document.getElementById('pillTrade').innerText=sess.trade||sess.cls||'টেক্সটাইল';
  document.getElementById('pillBranch').innerText=sess.branch||sess.section||'ক শাখা';
  document.getElementById('pillSem').innerText=sess.semester||sess.shift||'১ম সেমিস্টার';
  document.getElementById('pillSession').innerText=sess.session||'2022-23';
  buildAcc();showStu();renderHeaderCounts();
  setTimeout(()=>{ autoFit('instName',17,8); autoFit('instEng',13.5,7); },120);
}
function logout(){if(confirm('লগআউট?')){try{let sess=JSON.parse(localStorage.getItem('takrim_session')||'{}');let codeToRemove=sess.loginCode||sess.inst?.eiin||sess.inst?.schoolCode||'';let logs=JSON.parse(localStorage.getItem('takrim_login_logs')||'[]');logs=logs.filter(x=>x.code!==codeToRemove && x.code!==sess.inst?.eiin && x.code!==sess.inst?.schoolCode);localStorage.setItem('takrim_login_logs',JSON.stringify(logs));}catch(e){}localStorage.removeItem('takrim_session');location.href='index.html?v=textile_final';}}
function buildAcc(){document.getElementById('acc').innerHTML='<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span>▼</span></div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn2" style="background:#2e7d32;width:100%;padding:12px" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span>▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h-normal" style="background:#0d47a1" onclick="togN(3)"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="event.stopPropagation();setTab(\'present\')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div><div id="hb_absent" class="hbox boxAbsent" onclick="event.stopPropagation();setTab(\'absent\')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div><div id="hb_notice" class="hbox boxNotice" onclick="event.stopPropagation();setTab(\'notice\')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১) + মোট</span><span>▼</span></div><div class="acc-b-normal" id="ab4"><div style="display:flex;gap:6px"><input type="month" id="mp" value="'+new Date().toISOString().slice(0,7)+'" onchange="renderMonth()"><input type="number" id="dayPick" min="1" max="31" value="'+new Date().getDate()+'" style="width:80px" onchange="renderMonth()"></div><div id="monthTbl" style="margin-top:8px;overflow:auto"></div><div id="daySummary"></div><div style="display:flex;gap:6px;margin-top:10px"><button style="flex:1;background:#16a34a;color:#fff;padding:10px;border:none;border-radius:10px;font-weight:700" onclick="expMonthExcel()">⬇️ Excel</button><button style="flex:1;background:#dc2626;color:#fff;padding:10px;border:none;border-radius:10px;font-weight:700" onclick="downMonthPDF()">⬇️ PDF</button></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - আয়তক্ষেত্র + মোট % GPA</span><span>▼</span></div><div class="acc-b-normal" id="ab5"><div class="fifty"><b>বিষয়:</b><button onclick="chSub(-1)">-</button><input id="sc" type="number" value="3" style="text-align:center"><button onclick="chSub(1)">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 14px;border-radius:8px">সেট</button><span id="lockB"></span></div><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:8px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div class="fifty" style="margin-top:8px"><button style="background:#2e7d32;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button></div><div class="fifty" style="margin-top:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="expExcel()">⬇️ Excel A4</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="downPDF()">⬇️ PDF A4 প্যাড সহ</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div></div></div>';}
function togN(i){let b=document.getElementById('ab'+i);b.classList.toggle(i==3?'show':'on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet();}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;let e1=document.getElementById('hc_present');let e2=document.getElementById('hc_absent');if(e1)e1.innerText=p;if(e2)e2.innerText=students.length-p;}
function renderTab(){let p=students.filter(s=>s.present);let a=students.filter(s=>!s.present);let el=document.getElementById('tabContent');let dateStr=new Date().toLocaleDateString('bn-BD');if(activeTab=='present'){let listHtml=p.map(s=>`✅ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই';let nums=p.map(s=>s.mobile).filter(x=>x).join(',');el.innerHTML=`<div style="padding:10px;background:#e8f5e9;border-radius:12px;font-weight:700">${listHtml}</div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendSMS('${nums}','আপনার সন্তান আজ উপস্থিত ${dateStr}')" style="flex:1;background:#1565c0;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">📩 SMS</button><button onclick="sendWAList('present','আপনার সন্তান আজ উপস্থিত ${dateStr}')" style="flex:1;background:#25D366;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">💬 WhatsApp</button></div>`;}else if(activeTab=='absent'){let listHtml=a.map(s=>`❌ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই';let nums=a.map(s=>s.mobile).filter(x=>x).join(',');el.innerHTML=`<div style="padding:10px;background:#ffebee;border-radius:12px;font-weight:700">${listHtml}</div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendSMS('${nums}','আপনার সন্তান আজ অনুপস্থিত ${dateStr}')" style="flex:1;background:#c62828;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">📩 SMS</button><button onclick="sendWAList('absent','আপনার সন্তান আজ অনুপস্থিত ${dateStr}')" style="flex:1;background:#25D366;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">💬 WhatsApp</button></div>`;}else{el.innerHTML=`<textarea id="notice" rows="3" style="width:100%;padding:10px;border-radius:12px;border:1px solid #ccc">${localStorage.getItem(NOTICE_KEY)||''}</textarea><div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendSMSBulk()" style="flex:1;background:#1565c0;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">📩 সবাইকে SMS</button><button onclick="sendWABulk()" style="flex:1;background:#25D366;color:#fff;padding:12px;border:none;border-radius:12px;font-weight:700">💬 সবাইকে WhatsApp</button></div><button onclick="localStorage.setItem(NOTICE_KEY,document.getElementById('notice').value);alert('✅ নোটিশ সেভ')" style="width:100%;background:#ef6c00;color:#fff;padding:10px;border:none;border-radius:12px;margin-top:8px">💾 নোটিশ সেভ</button>`;}}
function sendSMS(nums,msg){if(!nums)return alert('মোবাইল নাই');window.location.href='sms:'+nums+'?body='+encodeURIComponent(msg);}
function sendWAList(type,msg){let list=type=='present'?students.filter(s=>s.present):students.filter(s=>!s.present);list.forEach(s=>{if(s.mobile)window.open('https://wa.me/88'+s.mobile.replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(msg));});}
function sendSMSBulk(){let nums=students.map(s=>s.mobile).filter(x=>x).join(',');let msg=document.getElementById('notice').value;sendSMS(nums,msg);}
function sendWABulk(){let msg=document.getElementById('notice').value;students.forEach(s=>{if(s.mobile)window.open('https://wa.me/88'+s.mobile.replace(/\D/g,'').slice(-10)+'?text='+encodeURIComponent(msg));});}
function showStu(){let box=document.getElementById('sList');if(!box)return;box.innerHTML=students.map((s,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 10px;border-radius:22px;margin:6px 0;background:${s.present?'#e6f9e8':'#fde8e8'}"><span>${i+1}. ${s.name} (${s.roll})</span><div style="display:flex;gap:6px"><button style="width:42px;height:36px;background:${s.present?'#2e7d32':'#c62828'};color:#fff;border-radius:20px;border:none;font-weight:800" onclick="toggleDaily(${i})">${s.present?'✅':'❌'}</button><button style="width:42px;height:36px;background:#fff;border:1px solid #ccc;border-radius:20px" onclick="students.splice(${i},1);localStorage.setItem(STUDENT_KEY,JSON.stringify(students));showStu();renderHeaderCounts();renderTab();renderMonth();">🗑️</button></div></div>`).join('');}
function toggleDaily(i){students[i].present=!students[i].present;localStorage.setItem(STUDENT_KEY,JSON.stringify(students));showStu();renderHeaderCounts();renderTab();let day=new Date().getDate();let m=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);let k='att_'+m+"_"+baseKey;let monthlyAtt=JSON.parse(localStorage.getItem(MONTHLY_KEY)||'{}');if(!monthlyAtt[k])monthlyAtt[k]={};if(!monthlyAtt[k][students[i].roll])monthlyAtt[k][students[i].roll]={};monthlyAtt[k][students[i].roll][day]=students[i].present?'P':'A';localStorage.setItem(MONTHLY_KEY,JSON.stringify(monthlyAtt));renderMonth();}
function renderMonth(){let m=document.getElementById('mp')?.value;if(!m)return;let monthlyAtt=JSON.parse(localStorage.getItem(MONTHLY_KEY)||'{}');let data=monthlyAtt['att_'+m+"_"+baseKey]||{};let tbl=document.getElementById('monthTbl');if(!tbl)return;let selectedDay=parseInt(document.getElementById('dayPick')?.value||new Date().getDate());let html='<div id="monthTableWrap"><table class="tbl" id="monthTable"><tr><th>রোল/দিন</th>';for(let d=1;d<=31;d++)html+=`<th style="${d==selectedDay?'background:#ffeb3b;color:#000':''}">${d}</th>`;html+='<th style="background:#2e7d32;color:#fff">মোট<br>উপস্থিত</th><th style="background:#c62828;color:#fff">মোট<br>অনুপস্থিত</th></tr>';let totalPDay=0,totalADay=0;students.forEach(s=>{let p=0,a=0;html+=`<tr><td style="text-align:left">${s.roll} ${s.name}</td>`;for(let d=1;d<=31;d++){let v=data[s.roll]?.[d]||'';if(v=='P')p++;if(v=='A')a++;html+=`<td style="background:${v=='A'?'#fde8e8':v=='P'?'#e8f5e9':'#fff'}">${v}</td>`;}html+=`<td style="background:#e8f5e9;font-weight:800">${p}</td><td style="background:#ffebee;font-weight:800">${a}</td></tr>`;let vd=data[s.roll]?.[selectedDay];if(vd=='P')totalPDay++;if(vd=='A')totalADay++;});html+='</table></div>';tbl.innerHTML=html;let sumBox=document.getElementById('daySummary');if(sumBox){sumBox.innerHTML=`<div style="padding:10px;background:#0d2a7a;color:#fff;border-radius:10px;text-align:center;font-weight:700;margin-top:6px">📅 ${selectedDay} তারিখ → ✅ মোট উপস্থিত: ${totalPDay} জন | ❌ মোট অনুপস্থিত: ${totalADay} জন</div>`;}}
function expMonthExcel(){let t=document.getElementById('monthTable');if(!t)return alert('টেবিল নাই');let wb=XLSX.utils.table_to_book(t);XLSX.writeFile(wb,'Monthly_Attendance_'+(document.getElementById('mp')?.value||'')+'.xlsx');}
function downMonthPDF(){let wrap=document.getElementById('monthTableWrap');if(!wrap)return alert('টেবিল নাই');html2canvas(wrap,{scale:2}).then(c=>{let {jsPDF}=window.jspdf;let pdf=new jsPDF('l','mm','a4');let img=c.toDataURL('image/png');let w=pdf.internal.pageSize.getWidth()-10;let h=(c.height/c.width)*w;pdf.addImage(img,'PNG',5,10,w,h);pdf.save('Monthly_Attendance_'+(document.getElementById('mp')?.value||'')+'.pdf');});}
function chSub(d){let el=document.getElementById('sc');let v=parseInt(el.value)||3;v+=d;if(v<1)v=1;if(v>10)v=10;el.value=v;}
function makeSheet(){let n=parseInt(document.getElementById('sc')?.value)||3;let saved=JSON.parse(localStorage.getItem(RESULT_KEY)||'null');let rh=document.getElementById('rh'),rb=document.getElementById('rb');if(!rh)return;let head='<tr><th>রোল</th><th>নাম</th>';for(let i=1;i<=n;i++)head+=`<th><input class="subName" id="subN${i}" placeholder="বিষয়${i}"><br><input class="subFull" id="subF${i}" placeholder="Full"></th>`;head+='<th>মোট</th><th>%</th><th>GPA</th></tr>';rh.innerHTML=head;let body='';students.forEach((s,i)=>{body+=`<tr><td>${s.roll}</td><td>${s.name}</td>`;for(let j=1;j<=n;j++)body+=`<td><input class="markGol" id="m_${i}_${j}" type="number" oninput="calcRes()"></td>`;body+=`<td id="tot_${i}">0</td><td id="per_${i}">0%</td><td id="gpa_${i}">0</td></tr>`;});rb.innerHTML=body;if(saved){let sc=saved.sc||n;if(document.getElementById('sc'))document.getElementById('sc').value=sc;saved.subs?.forEach((sb,i)=>{let a=document.getElementById(`subN${i+1}`),b=document.getElementById(`subF${i+1}`);if(a)a.value=sb.name;if(b)b.value=sb.full;});saved.marks?.forEach((row,i)=>{row.forEach((v,j)=>{let el=document.getElementById(`m_${i}_${j+1}`);if(el)el.value=v;});});calcRes();}}
function calcRes(){let n=parseInt(document.getElementById('sc')?.value)||3;students.forEach((s,i)=>{let total=0,fullTotal=0;for(let j=1;j<=n;j++){let m=parseFloat(document.getElementById(`m_${i}_${j}`)?.value)||0;let f=parseFloat(document.getElementById(`subF${j}`)?.value)||100;total+=m;fullTotal+=f;}let per=fullTotal?((total/fullTotal)*100).toFixed(1):0;let gpa=per>=80?5:per>=70?4:per>=60?3.5:per>=50?3:per>=40?2:0;let t=document.getElementById(`tot_${i}`),pe=document.getElementById(`per_${i}`),gp=document.getElementById(`gpa_${i}`);if(t)t.innerText=total;if(pe)pe.innerText=per+'%';if(gp)gp.innerText=gpa;});}
function saveRes(){let n=parseInt(document.getElementById('sc')?.value)||3;let data={sc:n,subs:[],marks:[]};for(let i=1;i<=n;i++)data.subs.push({name:document.getElementById(`subN${i}`)?.value||'',full:document.getElementById(`subF${i}`)?.value||''});students.forEach((s,i)=>{let row=[];for(let j=1;j<=n;j++)row.push(document.getElementById(`m_${i}_${j}`)?.value||'');data.marks.push(row);});localStorage.setItem(RESULT_KEY,JSON.stringify(data));document.getElementById('st').innerText='✅ সেভ লক হয়েছে';document.getElementById('rb').querySelectorAll('input').forEach(inp=>inp.disabled=true);}
function unlockRes(){document.getElementById('rb').querySelectorAll('input').forEach(inp=>inp.disabled=false);document.getElementById('st').innerText='✏️ এডিট মোড';}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n)return alert('নাম দিন');students.push({name:n,roll:r,mobile:m,present:true});localStorage.setItem(STUDENT_KEY,JSON.stringify(students));document.getElementById('sn').value='';document.getElementById('sr').value='';document.getElementById('sm').value='';showStu();renderHeaderCounts();renderTab();renderMonth();}
function expExcel(){let wb=XLSX.utils.table_to_book(document.getElementById('rt'));XLSX.writeFile(wb,'Result.xlsx');}
function downPDF(){let area=document.getElementById('pdfArea');html2canvas(area).then(c=>{let {jsPDF}=window.jspdf;let pdf=new jsPDF('p','mm','a4');let img=c.toDataURL('image/png');pdf.addImage(img,'PNG',5,20,200,120);pdf.save('Result.pdf');});}
showSecondPage();
</script></body></html>
