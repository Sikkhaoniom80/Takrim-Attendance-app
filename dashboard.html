<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ড্যাশবোর্ড - তাকরিম শিক্ষা নিকেতন</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hind Siliguri',Arial,sans-serif;background:linear-gradient(135deg,#0d1b2a,#1b3a5c);min-height:100vh;color:#fff;padding:20px}
.container{max-width:600px;margin:0 auto}
.header{text-align:center;margin-bottom:30px}
.header img{width:90px;height:90px;border-radius:50%;border:3px solid #ffd700}
.header h1{font-size:22px;margin-top:10px;color:#ffd700}
.header p{color:#aaa;font-size:14px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,215,0,.25);border-radius:16px;padding:24px;margin-bottom:16px;text-align:center}
.card h2{color:#ffd700;font-size:18px;margin-bottom:8px}
.card p{color:#ccc;font-size:14px;margin-bottom:16px}
.btn{display:inline-block;background:linear-gradient(135deg,#ffd700,#ffaa00);color:#0d1b2a;font-weight:bold;padding:12px 32px;border-radius:30px;text-decoration:none;font-size:16px}
.btn.blue{background:linear-gradient(135deg,#4da6ff,#0066cc);color:#fff}
.back{display:block;text-align:center;margin-top:20px;color:#aaa;text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="container">
<div class="header">
<img src="badge.jpg" alt="ব্যাজ">
<h1>তাকরিম শিক্ষা নিকেতন</h1>
<p>শিক্ষক ড্যাশবোর্ড</p>
</div>
<div class="card">
<h2>📝 হাজিরা নিন</h2>
<p>আজকের তারিখে ছাত্রদের উপস্থিতি মার্ক করুন</p>
<a class="btn" href="students.html">হাজিরা শুরু করুন</a>
</div>
<div class="card">
<h2>📊 রিপোর্ট দেখুন</h2>
<p>মাসিক ও দৈনিক হাজিরার রিপোর্ট</p>
<a class="btn blue" href="students.html">রিপোর্ট দেখুন</a>
</div>
<a class="back" href="index.html">← হোমে ফিরুন</a>
</div>
</body>
</html>
