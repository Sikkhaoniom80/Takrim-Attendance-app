<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ড্যাশবোর্ড - হাজিরা</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%;max-width:480px}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%;max-width:480px}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold;cursor:pointer}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.pad-bn{font-size:11.5px!important;font-weight:700!important;color:#0f2d5a!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.pad-en{font-size:9px!important;font-weight:700!important;color:#cc0000!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#monthlyDivFirst{display:none}
table.mtbl{border-collapse:collapse;font-size:11px}
table.mtbl th,table.mtbl td{border:1px solid #ccc;padding:4px 6px;text-align:center}
.pcell{background:#dcfce7;color:#16a34a;font-weight:bold}
.acell{background:#fee2e2;color:#dc2626;font-weight:bold}
.pa{padding:8px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.a-on{background:#f44336;color:#fff}
</style>
</head>
<body>
<div class="header" style="padding:10px 10px 35px">
<div class="college-pad"><div onclick="logoInput.click()" style="cursor:pointer;text-align:center;min-width:60px"><img id="boxLogo" src="https://via.placeholder.com/65"><div style="font-size:9px;color:blue">লোগো চেঞ্জ</div><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></div>
<div style="flex:1;overflow:hidden"><div id="boxNameBn" class="pad-bn" contenteditable="true" onblur="saveBox()">মালেকে বানু উচ্চ বিদ্যালয়</div><div id="boxNameEn" class="pad-en" contenteditable="true" onblur="saveBox()">Mallika banu Uchch vidyalay</div><div style="display:flex;gap:10px;margin-top:2px;font-size:10px;color:#333"><span>EIIN: <b><span id="boxEIIN" contenteditable="true" onblur="saveBox()">132322</span></b></span><span>Code: <b><span id="boxIns" contenteditable="true" onblur="saveBox()">50018</span></b></span></div></div></div>
<p id="boxStatus" style="color:#ffcc00;font-size:12px;height:12px;margin:5px 0 0"></p>
<p style="margin:8px 0 0;font-weight:700">শ্রেণী: <span id="showClass"></span></p></div>
<div class="card">
<button class="yellow-btn" onclick="location.href='students.html'">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="toggleMonthlyFirst()" style="width:100%;margin-top:12px;padding:14px;background:#fff;border:2px dashed #2563eb;border-radius:12px;font-weight:bold;color:#2563eb;cursor:pointer">📋 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDivFirst" style="overflow:auto;margin-top:10px;border:2px dashed #2563eb;border-radius:12px;padding:10px;background:#f8fafc"></div>
<h3>📢 নোটিশ বোর্ড</h3><input type="text" id="noticeText" placeholder="নোটিশ লিখুন..." oninput="saveNotice()">
<h3>💬 SMS পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendDirectSMS('present')">✅ উপস্থিত</button><button class="orange" onclick="sendDirectSMS('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendDirectSMS('notice')">📢 নোটিশ</button></div>
<h3>📲 WhatsApp-এ পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendWA('present')">✅ উপস্থিত</button><button class="orange" onclick="sendWA('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendWA('notice')">📢 নোটিশ</button></div>
<button onclick="shareReport()" style="width:100%;margin-top:10px;padding:14px;background:#25D366;color:white;border:none;border-radius:12px;font-weight:bold;cursor:pointer">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button>
<button onclick="location.href='index.html'" style="width:100%;margin-top:12px;padding:10px;background:#555;color:white;border:none;border-radius:10px;cursor:pointer">⬅️ লগআউট</button>
</div>
<script>
let currentClass=localStorage.getItem('takrim_current_class')||localStorage.getItem('takrim_current')||'';
let students=[],attendance={},attMonthly={},results={};
let subNames=["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"];
function key(n){return n+'_'+currentClass;}
function loadClassData(){students=JSON.parse(localStorage.getItem(key('students'))||'[]');attendance=JSON.parse(localStorage.getItem(key('att'))||'{}');attMonthly=JSON.parse(localStorage.getItem(key('attMonthly'))||'{}');results=JSON.parse(localStorage.getItem(key('results'))||'{}');subNames=JSON.parse(localStorage.getItem(key('subNames'))||'["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"]');}
function saveAll(){if(!currentClass)return;localStorage.setItem(key('students'),JSON.stringify(students));localStorage.setItem(key('att'),JSON.stringify(attendance));localStorage.setItem(key('attMonthly'),JSON.stringify(attMonthly));localStorage.setItem(key('results'),JSON.stringify(results));localStorage.setItem(key('subNames'),JSON.stringify(subNames));}
function getMonthInfo(){let d=new Date();let y=d.getFullYear(),m=d.getMonth();return{monthName:d.toLocaleString('bn-BD',{month:'long',year:'numeric'}),days:new Date(y,m+1,0).getDate(),key:y+'-'+m,today:d.getDate()};}
function saveBox(){let info={nameBn:boxNameBn.innerText.trim(),nameEn:boxNameEn.innerText.trim(),eiin:boxEIIN.innerText.trim(),ins:boxIns.innerText.trim(),logo:boxLogo.src};localStorage.setItem('collegeInfo',JSON.stringify(info));boxStatus.innerText="✅ সেভ হয়েছে";setTimeout(()=>boxStatus.innerText="",1200);}
function changeBoxLogo(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox();};r.readAsDataURL(f);}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(info.nameBn)boxNameBn.innerText=info.nameBn;if(info.nameEn)boxNameEn.innerText=info.nameEn;if(info.eiin)boxEIIN.innerText=info.eiin;if(info.ins)boxIns.innerText=info.ins;if(info.logo)boxLogo.src=info.logo;}
function toggleMonthlyFirst(){let d=document.getElementById('monthlyDivFirst');let open=d.style.display!=='block';d.style.display=open?'block':'none';if(open)renderMonthly();}
function renderMonthly(){let mi=getMonthInfo();let m=attMonthly[mi.key]||{};let h='<b>'+mi.monthName+'</b> ('+currentClass+')<div style="overflow:auto"><table class="mtbl"><tr><th>নাম</th>';for(let d=1;d<=mi.days;d++)h+='<th>'+d+'</th>';h+='<th>মোট</th></tr>';students.forEach((s,i)=>{let tot=0;h+='<tr><td style="text-align:left;white-space:nowrap">'+s.name+'</td>';for(let d=1;d<=mi.days;d++){let v=(m[i]&&m[i][d])||'';if(v==='P'){tot++;h+='<td class="pcell">P</td>';}else if(v==='A'){h+='<td class="acell">A</td>';}else h+='<td>-</td>';}h+='<td><b>'+tot+'</b></td></tr>';});h+='</table></div>';document.getElementById('monthlyDivFirst').innerHTML=h;}
function loadNotice(){document.getElementById('noticeText').value=localStorage.getItem(key('notice'))||'';}
function saveNotice(){if(!currentClass)return;localStorage.setItem(key('notice'),document.getElementById('noticeText').value);}
function colName(){let i=JSON.parse(localStorage.getItem('collegeInfo')||'{}');return i.nameBn||'প্রতিষ্ঠান';}
function todayBn(){return new Date().toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});}
function namesOf(t){return students.filter((s,i)=>t==='present'?attendance[i]!=='absent':attendance[i]==='absent').map(s=>s.name+(s.roll?' ('+s.roll+')':''));}
function buildMsg(t){let n=colName(),d=todayBn();if(t==='present')return '✅ উপস্থিতি\n'+n+'\nশ্রেণী: '+currentClass+'\nতারিখ: '+d+'\nআজ উপস্থিত: '+namesOf('present').length+' জন';if(t==='absent'){let a=namesOf('absent');return '❌ অনুপস্থিতি\n'+n+'\nশ্রেণী: '+currentClass+'\nতারিখ: '+d+'\nঅনুপস্থিত ('+a.length+' জন):\n'+a.join('\n');}return '📢 নোটিশ\n'+n+'\nশ্রেণী: '+currentClass+'\n'+(document.getElementById('noticeText').value||'');}
function sendDirectSMS(t){location.href='sms:?body='+encodeURIComponent(buildMsg(t));}
function sendWA(t){window.open('https://wa.me/?text='+encodeURIComponent(buildMsg(t)),'_blank');}
function shareReport(){let p=namesOf('present').length;let msg='📊 হাজিরা রিপোর্ট\n'+colName()+'\nশ্রেণী: '+currentClass+'\nতারিখ: '+todayBn()+'\nমোট: '+students.length+' | ✅ উপস্থিত: '+p+' | ❌ অনুপস্থিত: '+(students.length-p);window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');}
function fixDateBug(){}
showClass.innerText=currentClass;
loadClassData();loadBox();loadNotice();fixDateBug();
</script>
</body>
</html>
