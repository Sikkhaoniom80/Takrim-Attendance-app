<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>হাজিরা - লগইন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.logo{width:120px;height:120px;border-radius:50%;border:4px solid #ffd700;margin-top:20px;object-fit:cover;background:#fff}
.card{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:420px;margin-top:16px}
select,input{width:100%;padding:13px;border-radius:12px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:#fff}
label{font-weight:bold;font-size:14px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-y{background:linear-gradient(135deg,#ffcc00,#ffb300);color:#0f2d5a}
.btn-g{background:#16a34a;color:#fff}
.btn-d{background:#0f3d2e;color:#fff}
.btn-gray{background:#555;color:#fff}
.row2{display:flex;gap:8px}.row2>div{flex:1}
#addInstBox{display:none;border:2px dashed #16a34a;border-radius:12px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<img class="logo" src="badge.jpg" onerror="this.onerror=null;this.src='logo.jpg'">
<h2 style="margin:10px 0 0;color:#ffcc00">📋 ডিজিটাল হাজিরা</h2>

<div id="sessionBox" class="card" style="display:none;text-align:center">
<div style="font-size:15px">👋 স্বাগতম</div>
<h3 id="sessInst" style="margin:6px 0"></h3>
<div id="sessClass" style="color:#0f3d2e;font-weight:bold;margin-bottom:10px"></div>
<button class="btn btn-g" onclick="location.href='dashboard.html'">➜ ড্যাশবোর্ডে যান</button>
<button class="btn btn-y" onclick="showLoginForm()">🔄 শ্রেণি বদলান</button>
<button class="btn btn-gray" onclick="doLogout()">⬅️ লগআউট</button>
</div>

<div id="loginBox" class="card" style="display:none">
<label>🏫 প্রতিষ্ঠান</label>
<select id="l_inst"></select>
<button class="btn btn-d" onclick="toggleAddInst()" style="font-size:14px;padding:10px">➕ নতুন প্রতিষ্ঠান যোগ করুন</button>
<div id="addInstBox">
<input id="ni_bn" placeholder="প্রতিষ্ঠানের বাংলা নাম">
<input id="ni_en" placeholder="English Name">
<div class="row2"><div><input id="ni_eiin" placeholder="EIIN" style="margin:6px 0"></div><div><input id="ni_code" placeholder="Code" style="margin:6px 0"></div></div>
<input id="ni_pass" type="password" placeholder="পাসওয়ার্ড সেট করুন">
<button class="btn btn-g" onclick="saveNewInst()">✔️ সেভ করুন</button>
</div>
<label>🎓 ট্রেড / বিভাগ</label>
<select id="l_trade"><option>কম্পিউটার টেকনোলজি</option><option>ইলেকট্রিক্যাল টেকনোলজি</option><option>সিভিল টেকনোলজি</option><option>মেকানিক্যাল টেকনোলজি</option></select>
<div class="row2">
<div><label>📅 সেশন</label><select id="l_sess"><option>2025-26</option><option>2024-25</option><option>2026-27</option></select></div>
<div><label>📚 সেমিস্টার</label><select id="l_sem"><option>০১</option><option selected>০২</option><option>০৩</option><option>০৪</option><option>০৫</option><option>০৬</option><option>০৭</option><option>০৮</option></select></div>
</div>
<label>🔑 প্রতিষ্ঠান কোড</label><input id="l_code" placeholder="যেমন: 50018">
<label>🔑 পাসওয়ার্ড</label><input id="l_pass" type="password" placeholder="পাসওয়ার্ড দিন">
<button class="btn btn-y" onclick="teacherLogin()">প্রবেশ করুন ➜</button>
<p id="l_msg" style="color:red;font-size:14px"></p>
</div>

<script>
let insts=JSON.parse(localStorage.getItem('takrim_insts')||'[]');
let users=JSON.parse(localStorage.getItem('takrim_users')||'{}');
if(!insts.length){
insts=[{name:'প্রতিষ্ঠানের নাম',en:'',eiin:'',code:'50018',logo:'',pass:'1234'}];
users['50018']='1234';
localStorage.setItem('takrim_insts',JSON.stringify(insts));
localStorage.setItem('takrim_users',JSON.stringify(users));
}
function fillInst(){l_inst.innerHTML=insts.map((s,i)=>'<option value="'+i+'">'+s.name+'</option>').join('');}
function toggleAddInst(){let b=document.getElementById('addInstBox');b.style.display=b.style.display==='block'?'none':'block';}
function saveNewInst(){let bn=ni_bn.value.trim();if(!bn)return alert('নাম দিন');insts.push({name:bn,en:ni_en.value.trim(),eiin:ni_eiin.value.trim(),code:ni_code.value.trim(),logo:'',pass:ni_pass.value});if(ni_code.value.trim()&&ni_pass.value)users[ni_code.value.trim()]=ni_pass.value;localStorage.setItem('takrim_insts',JSON.stringify(insts));localStorage.setItem('takrim_users',JSON.stringify(users));ni_bn.value='';ni_en.value='';ni_eiin.value='';ni_code.value='';ni_pass.value='';fillInst();toggleAddInst();alert('✔️ প্রতিষ্ঠান যোগ হয়েছে');}
function showLoginForm(){sessionBox.style.display='none';loginBox.style.display='block';}
function doLogout(){localStorage.removeItem('takrim_session');location.reload();}
function teacherLogin(){let s=insts[+l_inst.value]||{};let code=l_code.value.trim(),pass=l_pass.value;if(!code||!pass){l_msg.textContent='কোড ও পাসওয়ার্ড দিন';return;}let ok=(users[code]&&users[code]===pass)||((s.code||'')===code&&(s.pass||'')===pass);if(!ok){l_msg.textContent='❌ ভুল কোড বা পাসওয়ার্ড!';return;}let cls=l_trade.value+' | সেশন '+l_sess.value+' | সেমিস্টার '+l_sem.value;localStorage.setItem('collegeInfo',JSON.stringify({nameBn:s.name||'',nameEn:s.en||'',eiin:s.eiin||'',ins:s.code||'',logo:s.logo||''}));localStorage.setItem('takrim_current',cls);localStorage.setItem('takrim_current_class',cls);localStorage.setItem('takrim_session','1');location.href='dashboard.html';}
fillInst();
if(localStorage.getItem('takrim_session')==='1'){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');sessInst.innerText=info.nameBn||'প্রতিষ্ঠান';sessClass.innerText='শ্রেণী: '+(localStorage.getItem('takrim_current_class')||'');sessionBox.style.display='block';}
else{loginBox.style.display='block';}
</script>
</body>
</html>
