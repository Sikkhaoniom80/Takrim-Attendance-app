<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hazira - Final</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#082a1e">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border-radius:22px;margin-top:10px}
.main-banner img{width:100%;display:block;border-radius:22px}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}
.menu{width:100%;max-width:430px;border:none;border-radius:16px;padding:16px;font-weight:700;margin-top:12px;display:flex;justify-content:center;cursor:pointer;border:3px solid #ffcc00}
.hidden{display:none!important}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}
.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}
.fifty{display:flex;gap:6px}.fifty>*{flex:1}
#logoPreview{width:95px;height:95px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;background:#fff;display:none;margin:0 auto}
#btnForm{background:#0d8bf2!important;color:#fff}#btnLogin{background:#7c3aed!important;color:#fff}#btnList{background:#dc2626!important;color:#fff}
#btnForm span,#btnLogin span,#btnList span{background:#000;color:#fff;padding:8px 22px;border-radius:30px;display:inline-block}
#btnCounter{background:#0fa3b1!important;gap:10px;cursor:default}
.counter-pill{flex:1;background:#000;color:#ffcc00;padding:10px 8px;border-radius:30px;border:2px solid #ffcc00;text-align:center;font-size:15px}
</style>
</head>
<body>
<div style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img src="icon-512.png"></div>
<button id="btnForm" class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')"><span>🏫 প্রতিষ্ঠান ফরম ▼</span></button>
<div id="formBox" class="card hidden" style="text-align:center">
<img id="logoPreview"><br><label for="logoInput" style="background:#ffcc00;padding:7px 18px;border-radius:20px;cursor:pointer;font-weight:700">🖼️ লোগো চেঞ্জ</label><input type="file" id="logoInput" accept="image/*" style="position:absolute;left:-9999px;opacity:0">
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="enName" placeholder="English Name"><input id="address" placeholder="ঠিকানা"><div class="fifty"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="প্রতিষ্ঠান কোড"></div><div class="fifty"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>
<button id="btnLogin" class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')"><span>🔐 লগইন ▼</span></button>
<div id="loginBox" class="card hidden">
<input id="instCodeLogin" placeholder="🏫 প্রতিষ্ঠান কোড / EIIN" oninput="findInstByCode()"><div id="foundInstName" style="text-align:center;font-weight:700;min-height:18px;color:green"></div><select id="tradeSel"></select><select id="branchSel"><option>ক শাখা</option><option>খ শাখা</option></select><select id="semesterSel"></select><select id="sessionSel"></select><input id="loginPass" type="password" placeholder="🔑 পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p>
</div>
<button id="btnCounter" class="menu"><span class="counter-pill">মোট প্রতিষ্ঠান: <b id="totalInst">০</b></span><span class="counter-pill">মোট লগইন: <b id="totalLoginCount">০</b></span></button>
<div class="card" style="text-align:center"><b style="font-size:14px">🛡️ সেফটি ব্যাকআপ</b><div class="fifty" style="margin-top:8px"><button class="btn" style="background:#000;color:#ffcc00" onclick="exportBackup()">📤 Backup ডাউনলোড</button><button class="btn" style="background:#ffcc00;color:#000" onclick="document.getElementById('importFile').click()">📥 Restore</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(event)"></div><p style="font-size:11px;color:gray;margin:6px 0 0 0">History Delete এর আগে Backup ডাউনলোড করে রাখুন</p></div>
<button id="btnList" class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')"><span>🔒 তালিকা ▼</span></button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
</div>
<script>
function safeGet(k){try{let a=localStorage.getItem(k);if(a)return a;let b=sessionStorage.getItem(k);if(b)return b;let c=localStorage.getItem(k+'_backup');if(c)return c;}catch(e){}return null;}
function safeSet(k,v){try{localStorage.setItem(k,v);}catch(e){}try{sessionStorage.setItem(k,v);}catch(e){}try{localStorage.setItem(k+'_backup',v);}catch(e){}}
let trades,sessions,insts,logs;
try{trades=JSON.parse(safeGet('takrim_trades')||'null');}catch(e){trades=null;}
if(!trades)trades=["টেক্সটাইল","গার্মেন্টস ডিজাইন","ইয়ার্ন ম্যানুফ্যাকচারিং","ফেব্রিক ম্যানুফ্যাকচারিং","ওয়েট প্রসেসিং","অ্যাপারেল ম্যানুফ্যাকচারিং","কম্পিউটার","ইলেকট্রিক্যাল","মেকানিক্যাল","সিভিল"];
try{sessions=JSON.parse(safeGet('takrim_sessions')||'null');}catch(e){sessions=null;}
if(!sessions)sessions=["2022-23","2023-24","2024-25","2025-26"];
let semesters=["১ম সেমিস্টার","২য় সেমিস্টার","৩য় সেমিস্টার","৪র্থ সেমিস্টার","৫ম সেমিস্টার","৬ষ্ঠ সেমিস্টার","৭ম সেমিস্টার","৮ম সেমিস্টার"];
try{insts=JSON.parse(safeGet('takrim_primary_insts')||'[]');if(!Array.isArray(insts))insts=[];}catch(e){insts=[];}
try{logs=JSON.parse(safeGet('takrim_login_logs')||'[]');if(!Array.isArray(logs))logs=[];}catch(e){logs=[];}
let tempLogo=safeGet('takrim_temp_logo')||'';let currentInst=null;
function loadLoginSelects(){document.getElementById('tradeSel').innerHTML=trades.map(t=>`<option>${t}</option>`).join('');document.getElementById('semesterSel').innerHTML=semesters.map(s=>`<option>${s}</option>`).join('');document.getElementById('sessionSel').innerHTML=sessions.map(s=>`<option>${s}</option>`).join('');}
loadLoginSelects();
function toBn(n){return n.toString().replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);}
function updateCounter(){document.getElementById('totalInst').innerText=toBn(insts.length);let unique=[...new Set(logs.map(l=>l.code))];document.getElementById('totalLoginCount').innerText=toBn(unique.length);}
updateCounter();
document.getElementById('logoInput').addEventListener('change',function(){if(!this.files[0])return;let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=600;c.height=600;let ctx=c.getContext('2d');let size=Math.min(img.width,img.height),sx=(img.width-size)/2,sy=(img.height-size)/2;ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);ctx.drawImage(img,sx,sy,size,size,0,0,600,600);tempLogo=c.toDataURL('image/png');let p=document.getElementById('logoPreview');p.src=tempLogo;p.style.display='block';safeSet('takrim_temp_logo',tempLogo);};img.src=e.target.result;};r.readAsDataURL(this.files[0]);});
function savePrimary(){let bn=document.getElementById('bnName').value.trim();let pass=document.getElementById('pass1').value.trim();if(!bn)return alert('প্রতিষ্ঠানের নাম দিন');if(!pass)return alert('পাসওয়ার্ড দিন');let o={bnName:bn,enName:document.getElementById('enName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:pass,logo:tempLogo||''};insts.push(o);safeSet('takrim_primary_insts',JSON.stringify(insts));safeSet('takrim_temp_logo','');updateCounter();alert('✅ সেভ হয়েছে');location.reload();}
function findInstByCode(){let code=document.getElementById('instCodeLogin').value.trim();currentInst=insts.find(x=>x.schoolCode==code||x.eiin==code);let el=document.getElementById('foundInstName');if(currentInst){el.innerText='✅ '+currentInst.bnName;el.style.color='green';}else{el.innerText=code?'❌ কোড পাওয়া যায়নি':'';el.style.color='red';}}
function primaryLogin(){if(!currentInst)return document.getElementById('loginMsg').textContent='❌ কোড দিন';if(document.getElementById('loginPass').value!==currentInst.pass)return document.getElementById('loginMsg').textContent='❌ ভুল পাস';let code=currentInst.schoolCode||currentInst.eiin;if(!logs.some(l=>l.code===code)){logs.push({code:code,time:new Date().toISOString(),name:currentInst.bnName});safeSet('takrim_login_logs',JSON.stringify(logs));}updateCounter();alert('✅ লগইন সফল: '+currentInst.bnName);}
function exportBackup(){let data={insts:safeGet('takrim_primary_insts')||'[]',logs:safeGet('takrim_login_logs')||'[]'};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Hazira_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function importBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){try{let d=JSON.parse(ev.target.result);if(d.insts)safeSet('takrim_primary_insts',d.insts);if(d.logs)safeSet('takrim_login_logs',d.logs);alert('✅ Restore হয়ে গেছে!');location.reload();}catch(err){alert('❌ ফাইল ভুল');}};r.readAsText(file);}
function openListSecure(){let p=prompt('Admin পাসওয়ার্ড');if(p!=='admin123')return alert('ভুল');document.getElementById('instList').innerHTML=insts.map((x,i)=>`<div style="border:1px solid #ccc;padding:8px;margin:5px;border-radius:10px"><b>${x.bnName}</b><br>EIIN:${x.eiin} Code:${x.schoolCode}<br>Mobile:${x.mobile}<br><button onclick="delInst(${i})" style="background:red;color:white;border:none;padding:5px 10px;border-radius:8px">Delete</button></div>`).join('');}
function delInst(i){if(!confirm('Delete?'))return;insts.splice(i,1);safeSet('takrim_primary_insts',JSON.stringify(insts));location.reload();}
</script>
</body>
</html>
