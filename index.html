<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Takrim - ফাইনাল</title>
<style>
*{box-sizing:border-box;font-family:Kalpurush,Noto Sans Bengali,sans-serif}
body{margin:0;background:#f1f5f9;padding:10px}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
select,input,button{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin-top:6px;font-size:14px}
button{border:none;font-weight:700;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#0d5bff;color:#fff;font-size:11px}
.editBtn{background:#0d5bff;color:#fff}
.sessBtn{background:#ff7a00;color:#fff}
.saveBtn{background:#16a34a;color:#fff}
.lock{background:#dc2626;color:#fff}
</style>
</head>
<body>

<div class="card">
<h3 style="text-align:center;margin:4px 0">🏫 তাকরিম - লগইন</h3>
<label>ট্রেড (১০টা ফিক্সড)</label><select id="tradeSel"></select>
<div class="grid2">
<button class="editBtn" onclick="editTrade()">🔧 ট্রেড এডিট (১০টা)</button>
<button class="sessBtn" onclick="editSession()">📅 সেশন এডিট (৪টা)</button>
</div>
<label>সেশন (ডিফল্ট ২০২৫-২৬)</label><select id="sessionSel"></select>
<label>সেমিস্টার</label><select id="semesterSel"></select>
</div>

<div class="card">
<h3>📅 মাসিক হাজিরা (১-৩১ + মোট ২টা)</h3>
<div id="monthBox"></div>
<button class="saveBtn" onclick="saveMonth()">💾 মাস সেভ</button>
</div>

<div class="card">
<h3>📝 ফলাফল (সাবজেক্ট টাচ করে এডিট)</h3>
<div id="resultBox"></div>
<div class="grid2">
<button class="saveBtn" onclick="saveResult()">💾 ফলাফল সেভ (লক হবে)</button>
<button class="lock" onclick="editResult()">✏️ এডিট করুন</button>
</div>
</div>

<script>
// ===== ১ ও ২. ট্রেড + সেশন একই নিয়মে ফিক্সড =====
let trades=JSON.parse(localStorage.getItem('takrim_trades')||'null')||["টেক্সটাইল","গার্মেন্টস ডিজাইন","ইয়ার্ন ম্যানুফ্যাকচারিং","ফেব্রিক ম্যানুফ্যাকচারিং","ওয়েট প্রসেসিং","অ্যাপারেল ম্যানুফ্যাকচারিং","কম্পিউটার","ইলেকট্রিক্যাল","মেকানিক্যাল","সিভিল"];
let sessions=JSON.parse(localStorage.getItem('takrim_sessions')||'null')||["2022-23","2023-24","2024-25","2025-26"];
let semesters=["১ম","২য়","৩য়","৪র্থ","৫ম","৬ষ্ঠ","৭ম","৮ম"];
let isLocked=false;

function loadLoginSelects(){
document.getElementById('tradeSel').innerHTML=trades.map(t=>`<option>${t}</option>`).join('');
document.getElementById('sessionSel').innerHTML=sessions.map(s=>`<option>${s}</option>`).join('');
document.getElementById('semesterSel').innerHTML=semesters.map(s=>`<option>${s}</option>`).join('');
// ডিফল্ট ২০২৫-২৬
let ss=document.getElementById('sessionSel');
for(let i=0;i<ss.options.length;i++){ if(ss.options[i].value.includes('2025-26')){ ss.selectedIndex=i; break; } }
}
function editTrade(){
let h='<div id="boxE" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;display:flex;justify-content:center;align-items:center;padding:10px"><div style="background:#fff;width:100%;max-width:400px;border-radius:16px;padding:14px;max-height:90vh;overflow:auto"><h3 style="text-align:center">🔧 ট্রেড (১০টা ফিক্সড)</h3>';
for(let i=0;i<10;i++) h+=`<div style="display:flex;gap:6px;margin-bottom:6px"><span style="width:20px;padding:10px 0;font-weight:700">${i+1}.</span><input id="t_${i}" value="${trades[i]}" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #0d5bff;background:#eef4ff;font-weight:600"></div>`;
h+=`<div style="display:flex;gap:8px;margin-top:12px"><button onclick="saveTradeEdit()" style="flex:1;background:#16a34a;color:#fff;padding:12px;border:none;border-radius:10px">💾 সেভ</button><button onclick="document.getElementById('boxE').remove()" style="flex:1;background:#666;color:#fff;padding:12px;border:none;border-radius:10px">বন্ধ</button></div></div></div>';
document.body.insertAdjacentHTML('beforeend',h);
}
function saveTradeEdit(){
for(let i=0;i<10;i++){ let v=document.getElementById(`t_${i}`).value.trim(); if(v) trades[i]=v; }
localStorage.setItem('takrim_trades',JSON.stringify(trades)); loadLoginSelects();
document.getElementById('boxE').remove();
}
function editSession(){
let h='<div id="boxE" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;display:flex;justify-content:center;align-items:center;padding:10px"><div style="background:#fff;width:100%;max-width:400px;border-radius:16px;padding:14px"><h3 style="text-align:center">📅 সেশন (৪টা ফিক্সড)</h3>';
for(let i=0;i<4;i++) h+=`<div style="display:flex;gap:6px;margin-bottom:6px"><span style="width:20px;padding:10px 0;font-weight:700">${i+1}.</span><input id="s_${i}" value="${sessions[i]}" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #ff7a00;background:#fff8f0;font-weight:700;text-align:center"></div>`;
h+=`<div style="display:flex;gap:8px;margin-top:12px"><button onclick="saveSessEdit()" style="flex:1;background:#ff7a00;color:#fff;padding:12px;border:none;border-radius:10px">💾 সেভ</button><button onclick="document.getElementById('boxE').remove()" style="flex:1;background:#666;color:#fff;padding:12px;border:none;border-radius:10px">বন্ধ</button></div></div></div>';
document.body.insertAdjacentHTML('beforeend',h);
}
function saveSessEdit(){
for(let i=0;i<4;i++){ let v=document.getElementById(`s_${i}`).value.trim(); if(v) sessions[i]=v; }
localStorage.setItem('takrim_sessions',JSON.stringify(sessions)); loadLoginSelects();
document.getElementById('boxE').remove();
}

// ===== ৩. তারিখ ৩১ + মোট ২টা =====
function renderMonth(){
let th='',td='';
for(let i=1;i<=31;i++){ th+=`<th>${i}</th>`; td+=`<td><input style="width:30px;padding:4px" placeholder="P/A"></td>`; }
th+=`<th style="background:#16a34a">মোট<br>উপস্থিত</th><th style="background:#dc2626">মোট<br>অনুপস্থিত</th>`;
td+=`<td><input id="totP" style="width:40px;background:#dcfce7;font-weight:700"></td><td><input id="totA" style="width:40px;background:#fee2e2;font-weight:700"></td>`;
document.getElementById('monthBox').innerHTML=`<div style="overflow:auto"><table><tr>${th}</tr><tr>${td}</tr></table></div>`;
}
function saveMonth(){ alert('✅ মাস সেভ: '+document.getElementById('totP').value+' উপস্থিত, '+document.getElementById('totA').value+' অনুপস্থিত'); }

// ===== ৪. ফলাফল সেভ লক =====
function renderResult(){
let h='<table><tr><th>বিষয় (টাচ করে লিখুন)</th><th>নম্বর</th></tr>';
for(let i=1;i<=6;i++) h+=`<tr><td><input id="subN${i}" class="subName" placeholder="বিষয়${i} - টাচ করে লিখুন" ${isLocked?'disabled':''}></td><td><input id="subM${i}" type="number" placeholder="০-১০০" ${isLocked?'disabled':''}></td></tr>`;
h+='</table>'; document.getElementById('resultBox').innerHTML=h;
}
function saveResult(){ isLocked=true; renderResult(); alert('🔒 ফলাফল লক হয়েছে'); }
function editResult(){ isLocked=false; renderResult(); }

loadLoginSelects(); renderMonth(); renderResult();
</script>
</body>
</html>
