<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Takrim - Polytechnic Textile</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}body{margin:0;background:#0a1931;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}.main-banner img{width:100%;display:block}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;cursor:pointer;border:3px solid #ffcc00}.hidden{display:none!important}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}.yellow{background:#ffcc00;color:#1a1a1a}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}
.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold}.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}.fifty{display:flex;gap:6px}.fifty>*{flex:1}
#logoPreview{width:95px;height:95px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;object-position:center;background:#fff;display:none;margin:0 auto}
#institutePadFull{width:100%;max-width:800px;background:#fff;border:1px solid #ccc;overflow:hidden}.padTop{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff}.padLogo{width:95px;height:95px;border-radius:50%;border:3px solid #0a2a7a;object-fit:cover;flex-shrink:0;background:#fff}.padText{flex:1;text-align:center;line-height:1.2;overflow:hidden;min-width:0}.bnName{font-weight:700;color:#1a237e;font-size:17px;white-space:nowrap;display:block;width:100%;overflow:hidden}.enName{font-weight:700;color:#b71c1c;font-size:13.5px;white-space:nowrap;display:block;width:100%;overflow:hidden;text-transform:uppercase}.bnAddr{font-size:13px;color:#000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.line4,.line5{font-size:11px;color:#000;white-space:nowrap}.blueLine{width:100%;height:2px;background:#0d2a7a}.classPillWrap{width:100%;display:flex;justify-content:center;padding:5px 0 8px 0;background:#fff}.classPill{background:#0d2a7a;color:#fff;padding:5px 18px;border-radius:0 0 12px 12px;font-size:12px;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:12px;text-align:center;background:#fff}.tbl th{background:#0f5d1a;color:#fff;padding:8px 3px}.tbl td{padding:4px;border:1px solid #e2e8f0}
.subName{width:90px;padding:8px 6px;border-radius:6px;border:1.5px solid #0f5d1a;background:#e8f5e9;text-align:center;font-weight:700}
.markGol{width:60px;height:36px;border-radius:6px;border:1.5px solid #94a3b8;background:#fff;text-align:center;font-weight:700}
</style></head><body>

<div id="firstPageWrap" style="width:100%;display:flex;flex-direction:column;align-items:center">
<!-- তোমার ছবিসহ ব্যানার -->
<div class="main-banner"><img src="final_banner.jpg" onerror="this.src='/mnt/data/final_banner.jpg'"></div>

<div style="width:100%;max-width:430px;margin-top:12px">
<button class="menu" style="background:#22c55e;color:#fff;border-color:#ffcc00" onclick="tog('formBox')">🏫 স্কুল কলেজের হাজিরা / প্রতিষ্ঠান যোগ ▼</button>
<div id="formBox" class="card hidden" style="text-align:center">
<img id="logoPreview" src=""><label for="logoInput" style="background:#ffcc00;color:#000;font-weight:700;font-size:14px;margin-top:10px;padding:7px 18px;border-radius:20px;cursor:pointer;display:inline-block">🖼️ লোগো চেঞ্জ ৯৫x৯৫ গোল</label><input type="file" id="logoInput" accept="image/*" style="position:absolute;left:-9999px;opacity:0;width:1px;height:1px">
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম (যেমন: পলিটেকনিক টেক্সটাইল)"><input id="enName" placeholder="English Name"><input id="address" placeholder="ঠিকানা"><div class="fifty"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="Code"></div><div class="fifty"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div><input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>

<button class="menu" style="background:#fb923c;color:#000" onclick="tog('tradeBox')">🔧 ট্রেড / সেশন / সেমিস্টার (১০টা+৪টা ফিক্সড) ▼</button>
<div id="tradeBox" class="card hidden">
<label>ট্রেড (১০টা ফিক্সড) - চাপলে অটো, টাচ করে এডিট</label><select id="tradeSel"></select>
<button class="btn blue" onclick="editTrade()">🔧 ট্রেড এডিট (১০টা ফিক্সড) - টাচ করে নাম বদলান</button>
<label style="margin-top:10px">সেশন (ডিফল্ট ২০২৫-২৬) - ৪টা ফিক্সড</label><select id="sessionSel"></select>
<button class="btn" style="background:#ff7a00;color:#fff" onclick="editSession()">📅 সেশন এডিট (৪টা ফিক্সড) - ২০২৫-২৬</button>
<label>সেমিস্টার</label><select id="semesterSel"></select>
</div>

<button class="menu" style="background:#3b82f6;color:#fff" onclick="tog('loginBox')">🔐 প্রতিষ্ঠান লগইন ▼</button>
<div id="loginBox" class="card hidden"><select id="loginInst"></select><div class="fifty"><select id="shift"><option>🌅 প্রভাতি</option><option>দিবা</option></select><select id="cls"><option>১ম সেমিস্টার</option><option>২য় সেমিস্টার</option><option>৩য় সেমিস্টার</option><option>৪র্থ সেমিস্টার</option><option>৫ম সেমিস্টার</option><option>৬ষ্ঠ সেমিস্টার</option><option>৭ম সেমিস্টার</option><option>৮ম সেমিস্টার</option></select><select id="section"><option>টেক্সটাইল</option><option>গার্মেন্টস</option><option>কম্পিউটার</option></select></div><input id="loginPass" type="password" placeholder="পাসওয়ার্ড"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button><p id="loginMsg" style="color:red;text-align:center"></p></div>

<button class="menu" style="background:#ef4444;color:#fff" onclick="tog('listBox')">🔒 প্রতিষ্ঠানের তালিকা ▼</button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
</div>
</div>

<!-- SECOND PAGE -->
<div id="secondPageWrap" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div id="institutePadFull"><div class="padTop"><img id="padLogo" class="padLogo" src=""><div class="padText"><div id="instName" class="bnName"></div><div id="instEng" class="enName"></div><div id="instAddr" class="bnAddr"></div><div class="line4">EIIN: <span id="padEiin"></span> | Code: <span id="padCode"></span></div><div class="line5">Mobile: <span id="padMobile"></span> | Email: <span id="padEmail"></span></div></div></div><div class="blueLine"></div><div class="classPillWrap"><div class="classPill">ট্রেড: <span id="pillTrade"></span> | সেশন: <span id="pillSess"></span> | সেমিস্টার: <span id="pillCls"></span></div></div></div>
<div style="text-align:center;margin-top:8px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px;font-size:12px">🚪 লগআউট</button></div>
<div id="acc" style="width:100%;max-width:430px;margin-top:10px"></div>
</div>

<script>
function tog(id){document.getElementById(id).classList.toggle('hidden')}
// ===== ১+২. ফিক্সড লজিক - একই নিয়ম =====
let defaultTrades=["টেক্সটাইল","গার্মেন্টস ডিজাইন","ইয়ার্ন ম্যানুফ্যাকচারিং","ফেব্রিক ম্যানুফ্যাকচারিং","ওয়েট প্রসেসিং","অ্যাপারেল ম্যানুফ্যাকচারিং","কম্পিউটার","ইলেকট্রিক্যাল","মেকানিক্যাল","সিভিল"];
let defaultSessions=["2022-23","2023-24","2024-25","2025-26"];
let t=JSON.parse(localStorage.getItem('takrim_trades')||'null'); let trades=(t&&t.length>=10)?t:[...defaultTrades];
let s=JSON.parse(localStorage.getItem('takrim_sessions')||'null'); let sessions=(s&&s.length>=4)?s:[...defaultSessions];
let semesters=["১ম সেমিস্টার","২য় সেমিস্টার","৩য় সেমিস্টার","৪র্থ সেমিস্টার","৫ম সেমিস্টার","৬ষ্ঠ সেমিস্টার","৭ম সেমিস্টার","৮ম সেমিস্টার"];
let rawInsts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');let mapDedup=new Map();rawInsts.forEach(x=>{let k=(x.bnName||'').trim();if(k&&!mapDedup.has(k))mapDedup.set(k,x);});let insts=[...mapDedup.values()];localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');let tempLogo=localStorage.getItem('takrim_temp_logo')||'';

function loadLoginSelects(){
let tSel=document.getElementById('tradeSel'), sSel=document.getElementById('sessionSel'), semSel=document.getElementById('semesterSel');
if(!tSel) return;
tSel.innerHTML=trades.map(v=>`<option value="${v}">${v}</option>`).join('');
sSel.innerHTML=sessions.map(v=>`<option value="${v}">${v}</option>`).join('');
semSel.innerHTML=semesters.map(v=>`<option>${v}</option>`).join('');
for(let i=0;i<sSel.options.length;i++){ if(sSel.options[i].value.indexOf('2025-26')>-1){ sSel.selectedIndex=i; break; } }
let loginInst=document.getElementById('loginInst'); if(loginInst) loginInst.innerHTML='<option value="">প্রতিষ্ঠান নির্বাচন</option>'+insts.map((x,i)=>'<option value="'+i+'">'+x.bnName+'</option>').join('');
}
function editTrade(){
let h='<div id="boxE" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;display:flex;justify-content:center;align-items:center;padding:10px"><div style="background:#fff;width:100%;max-width:400px;border-radius:16px;padding:14px;max-height:90vh;overflow:auto"><h3 style="text-align:center">🔧 ট্রেড (১০টা ফিক্সড)</h3><p style="font-size:11px;text-align:center;color:#666">ঘরে টাচ করে নাম বদলান</p>';
for(let i=0;i<10;i++) h+=`<div style="display:flex;gap:6px;margin-bottom:6px"><span style="width:20px;padding:10px 0;font-weight:700">${i+1}.</span><input id="t_${i}" value="${trades[i]}" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #0d5bff;background:#eef4ff;font-weight:600"></div>`;
h+=`<div style="display:flex;gap:8px;margin-top:12px"><button onclick="saveTradeEdit()" style="flex:1;background:#16a34a;color:#fff;padding:12px;border:none;border-radius:10px">💾 সেভ</button><button onclick="document.getElementById('boxE').remove()" style="flex:1;background:#666;color:#fff;padding:12px;border:none;border-radius:10px">বন্ধ</button></div></div></div>';
document.body.insertAdjacentHTML('beforeend',h);
}
function saveTradeEdit(){ for(let i=0;i<10;i++){ let v=document.getElementById(`t_${i}`).value.trim(); if(v) trades[i]=v; } localStorage.setItem('takrim_trades',JSON.stringify(trades)); loadLoginSelects(); document.getElementById('boxE').remove(); alert('✅ ট্রেড ১০টা ফিক্সড আপডেট'); }
function editSession(){
let h='<div id="boxE" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:9999;display:flex;justify-content:center;align-items:center;padding:10px"><div style="background:#fff;width:100%;max-width:400px;border-radius:16px;padding:14px"><h3 style="text-align:center">📅 সেশন (৪টা ফিক্সড)</h3>';
for(let i=0;i<4;i++) h+=`<div style="display:flex;gap:6px;margin-bottom:6px"><span style="width:20px;padding:10px 0;font-weight:700">${i+1}.</span><input id="s_${i}" value="${sessions[i]}" style="flex:1;padding:10px;border-radius:8px;border:1.5px solid #ff7a00;background:#fff8f0;font-weight:700;text-align:center"></div>`;
h+=`<div style="display:flex;gap:8px;margin-top:12px"><button onclick="saveSessEdit()" style="flex:1;background:#ff7a00;color:#fff;padding:12px;border:none;border-radius:10px">💾 সেভ</button><button onclick="document.getElementById('boxE').remove()" style="flex:1;background:#666;color:#fff;padding:12px;border:none;border-radius:10px">বন্ধ</button></div></div></div>';
document.body.insertAdjacentHTML('beforeend',h);
}
function saveSessEdit(){ for(let i=0;i<4;i++){ let v=document.getElementById(`s_${i}`).value.trim(); if(v) sessions[i]=v; } localStorage.setItem('takrim_sessions',JSON.stringify(sessions)); loadLoginSelects(); document.getElementById('boxE').remove(); alert('✅ সেশন ৪টা ফিক্সড (২০২৫-২৬)'); }

document.getElementById('logoInput').addEventListener('change',function(){ if(!this.files[0]) return; let r=new FileReader(); r.onload=e=>{ let img=new Image(); img.onload=()=>{ let c=document.createElement('canvas'); c.width=600;c.height=600; let ctx=c.getContext('2d'); let size=Math.min(img.width,img.height),sx=(img.width-size)/2,sy=(img.height-size)/2; ctx.fillStyle='#fff'; ctx.fillRect(0,0,600,600); ctx.drawImage(img,sx,sy,size,size,0,0,600,600); tempLogo=c.toDataURL('image/png'); document.getElementById('logoPreview').src=tempLogo; document.getElementById('logoPreview').style.display='block'; localStorage.setItem('takrim_temp_logo',tempLogo); }; img.src=e.target.result; }; r.readAsDataURL(this.files[0]); });
function savePrimary(){ let bn=document.getElementById('bnName').value.trim(); let pass=document.getElementById('pass1').value.trim(); if(!bn) return alert('প্রতিষ্ঠানের নাম দিন'); if(!pass) return alert('পাসওয়ার্ড দিন'); if(insts.some(x=>x.bnName.trim()===bn)) return alert('❌ আগেই আছে'); let o={bnName:bn,enName:document.getElementById('enName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:pass,logo:tempLogo||''}; insts.push(o); localStorage.setItem('takrim_primary_insts',JSON.stringify(insts)); localStorage.setItem('takrim_temp_logo',''); alert('✅ সেভ'); location.reload(); }
function primaryLogin(){ let idx=document.getElementById('loginInst').value; if(idx==='') return document.getElementById('loginMsg').textContent='প্রতিষ্ঠান নির্বাচন'; let ins=insts[idx]; if(document.getElementById('loginPass').value!==ins.pass) return document.getElementById('loginMsg').textContent='❌ ভুল পাস'; localStorage.setItem('takrim_session',JSON.stringify({inst:ins,trade:document.getElementById('tradeSel').value,session:document.getElementById('sessionSel').value,sem:document.getElementById('semesterSel').value,shift:document.getElementById('shift').value,cls:document.getElementById('cls').value,section:document.getElementById('section').value})); showSecondPage(); }
function autoFit(id,max,min){ let el=document.getElementById(id); if(!el) return; let size=max; el.style.fontSize=size+'px'; let parentW=el.parentElement.clientWidth; while(el.scrollWidth>parentW && size>min){ size-=0.5; el.style.fontSize=size+'px'; } }
function showSecondPage(){ let sess=JSON.parse(localStorage.getItem('takrim_session')||'null'); if(!sess) return; document.getElementById('firstPageWrap').classList.add('hidden'); document.getElementById('secondPageWrap').classList.remove('hidden'); document.body.style.background='#f0f4f8'; document.getElementById('instName').innerText=sess.inst.bnName||''; document.getElementById('instEng').innerText=sess.inst.enName||''; document.getElementById('instAddr').innerText=sess.inst.addr||''; let logoEl=document.getElementById('padLogo'); if(sess.inst.logo) logoEl.src=sess.inst.logo; document.getElementById('padEiin').innerText=sess.inst.eiin||''; document.getElementById('padCode').innerText=sess.inst.schoolCode||''; document.getElementById('padMobile').innerText=sess.inst.mobile||''; document.getElementById('padEmail').innerText=sess.inst.email||''; document.getElementById('pillTrade').innerText=sess.trade||sess.section; document.getElementById('pillSess').innerText=sess.session||'2025-26'; document.getElementById('pillCls').innerText=sess.sem||sess.cls; buildAcc(); setTimeout(()=>{ autoFit('instName',17,8); autoFit('instEng',13.5,7); },120); }
function openListSecure(){ let a=prompt('এডমিন নাম'),p=prompt('পাসওয়ার্ড'); if(a!=='malek'||p!=='takrim2022') return alert('ভুল'); document.getElementById('instList').innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee"><div style="display:flex;align-items:center;gap:8px"><img src="${s.logo||''}" style="width:36px;height:36px;border-radius:50%;object-fit:cover"><div><div style="font-weight:700;font-size:13px">${s.bnName}</div><div style="font-size:11px;background:#f3f4f6;padding:4px 8px;border-radius:8px">🔑 <b style="color:#dc2626">${s.pass}</b></div></div></div><button onclick="if(confirm('ডিলিট?')){insts.splice(${i},1);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));location.reload();}" style="background:#fee2e2;border:none;padding:8px;border-radius:10px">🗑️</button></div>`).join(''); }
function logout(){ if(confirm('লগআউট?')){ localStorage.removeItem('takrim_session'); location.reload(); } }
// ===== ACC =====
let isLocked=false;
function buildAcc(){ document.getElementById('acc').innerHTML=`<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span>▼</span></div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><button class="btn green" style="padding:10px" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span>▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১ + মোট ২টা)</span><span>▼</span></div><div class="acc-b-normal" id="ab4"><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()"><div id="monthTbl" style="margin-top:8px;overflow:auto"></div><button class="btn green" onclick="saveMonth()" style="margin-top:8px">💾 মাস সেভ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল (টাচ করে এডিট + সেভ লক)</span><span>▼</span></div><div class="acc-b-normal" id="ab5"><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:6px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div class="fifty" style="margin-top:8px"><button class="btn green" onclick="saveRes()">💾 সেভ লক</button><button class="btn" style="background:#ff9800;color:#fff" onclick="unlockRes()">✏️ এডিট করুন</button></div></div></div>`; }
function togN(i){ let b=document.getElementById('ab'+i); b.classList.toggle('on'); if(i==2) showStu(); if(i==4) renderMonth(); if(i==5) makeSheet(); }
function addStu(){ let n=document.getElementById('sn').value.trim(), r=document.getElementById('sr').value.trim(); if(!n||!r) return alert('নাম রোল দিন'); students.push({name:n,roll:r,present:true}); localStorage.setItem('students_v2',JSON.stringify(students)); showStu(); }
function showStu(){ let el=document.getElementById('sList'); if(!el) return; el.innerHTML=students.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>${s.name} (${s.roll})</span><button onclick="students.splice(${i},1);localStorage.setItem('students_v2',JSON.stringify(students));showStu();" style="background:#fee2e2;border:none;padding:4px 8px;border-radius:6px">🗑️</button></div>`).join('')||'কেউ নেই'; }
// ===== ৩. মাসিক ৩১+২ =====
function renderMonth(){
let mp=document.getElementById('mp')?.value||new Date().toISOString().slice(0,7);
let days=new Date(mp.split('-')[0],mp.split('-')[1],0).getDate();
let th='', rowH='<th style="position:sticky;left:0;background:#0f5d1a;z-index:2">নাম/রোল</th>';
for(let i=1;i<=31;i++){ rowH+=`<th>${i}</th>`; }
rowH+=`<th style="background:#16a34a">মোট<br>উপ</th><th style="background:#dc2626">মোট<br>অনু</th>`;
let body='';
students.forEach((st,idx)=>{
let r=`<tr><td style="position:sticky;left:0;background:#fff;white-space:nowrap">${st.name}</td>`;
for(let d=1;d<=31;d++){ let key=`${mp}_${idx}_${d}`; let v=localStorage.getItem('att_'+key)||''; r+=`<td><input id="att_${key}" value="${v}" style="width:28px;padding:4px;text-align:center" placeholder="" oninput="calcTotal(${idx})"></td>`; }
r+=`<td><input id="totP_${idx}" style="width:36px;background:#dcfce7;font-weight:700;text-align:center" readonly></td><td><input id="totA_${idx}" style="width:36px;background:#fee2e2;font-weight:700;text-align:center" readonly></td></tr>`;
body+=r;
});
document.getElementById('monthTbl').innerHTML=`<table class="tbl"><thead><tr>${rowH}</tr></thead><tbody>${body}</tbody></table>`;
students.forEach((_,i)=>calcTotal(i));
}
function calcTotal(idx){
let mp=document.getElementById('mp').value; let p=0,a=0;
for(let d=1;d<=31;d++){ let el=document.getElementById(`att_${mp}_${idx}_${d}`); if(!el) continue; let v=el.value.trim().toUpperCase(); if(v=='P'||v=='প'||v=='1') p++; else if(v=='A'||v=='অ'||v=='0') a++; localStorage.setItem('att_'+`${mp}_${idx}_${d}`, el.value); }
let tp=document.getElementById(`totP_${idx}`), ta=document.getElementById(`totA_${idx}`); if(tp) tp.value=p; if(ta) ta.value=a;
}
function saveMonth(){ alert('✅ মাসিক হাজিরা সেভ (৩১+২টা)'); }
// ===== ৪. ফলাফল লক =====
function makeSheet(){
let h='<tr><th>রোল</th><th>নাম</th><th>বিষয় (টাচ)</th><th>নম্বর</th></tr>'; document.getElementById('rh').innerHTML=h;
let b=''; students.forEach((st,i)=>{
let sub=localStorage.getItem(`subN_${i}`)||`বিষয়${i+1}`;
let mark=localStorage.getItem(`mark_${i}`)||'';
b+=`<tr><td>${st.roll}</td><td>${st.name}</td><td><input id="subN_${i}" class="subName" value="${sub}" placeholder="বিষয় টাচ" ${isLocked?'disabled':''} oninput="localStorage.setItem('subN_${i}',this.value)"></td><td><input id="mark_${i}" class="markGol" type="number" value="${mark}" placeholder="০" ${isLocked?'disabled':''} oninput="localStorage.setItem('mark_${i}',this.value)"></td></tr>`;
});
document.getElementById('rb').innerHTML=b||'<tr><td colspan="4">শিক্ষার্থী নেই</td></tr>';
}
function saveRes(){ isLocked=true; makeSheet(); alert('🔒 ফলাফল লক হয়েছে - এখন এডিট হবে না'); }
function unlockRes(){ isLocked=false; makeSheet(); alert('✏️ এডিট খুলেছে - এখন বিষয়ে টাচ করে লিখতে পারবে'); }

loadLoginSelects();
let sess=JSON.parse(localStorage.getItem('takrim_session')||'null'); if(sess) showSecondPage();
</script>
</body></html>
