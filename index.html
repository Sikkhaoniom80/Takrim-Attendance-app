<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FINAL - Textile Polytechnic Hazira</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#082a1e;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:10px}
.main-banner{width:380px;max-width:95%;border:4px solid #ffcc00;border-radius:22px;overflow:hidden;margin-top:10px;background:#000;line-height:0}
.main-banner img{width:100%;display:block}
.green-box{width:380px;max-width:95%;background:#16a34a;border-radius:16px;padding:12px;margin-top:20px;text-align:center;border:3px solid #ffcc00}
.green-box span{background:#000;color:#fff;display:inline-block;padding:8px 22px;border-radius:30px;font-weight:700;font-size:18px}
.card{background:#fff;margin-top:12px;border-radius:24px;padding:16px;width:100%;max-width:430px}
.menu{width:100%;max-width:430px;background:#fff;border:none;border-radius:16px;padding:16px;font-weight:700;color:#0d5bff;margin-top:12px;display:flex;justify-content:space-between;cursor:pointer}
.hidden{display:none!important}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:700;cursor:pointer;margin-top:8px}
.green{background:#0a7a42;color:#fff}.blue{background:#0d5bff;color:#fff}.red{background:#d61f1f;color:#fff}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:5px 0}
.acc{margin-bottom:8px;border-radius:12px;overflow:hidden;background:#fff;width:100%;max-width:430px}
.acc-h-normal{background:#1976d2;color:#fff;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;border-radius:12px 12px 0 0}
.acc-b-normal{display:none;padding:8px;background:#fafafa}.acc-b-normal.on{display:block}
.acc-b{display:none;padding:8px;background:#fafafa}.acc-b.show{display:block}
.fifty{display:flex;gap:6px}.fifty>*{flex:1}
#logoPreview{width:95px;height:95px;border-radius:50%;border:3px solid #ffcc00;object-fit:cover;background:#fff;display:none;margin:0 auto}
.header3{display:flex;gap:6px;width:100%}.hbox{flex:1;padding:14px 2px;border-radius:14px;text-align:center;font-weight:bold;font-size:13px;cursor:pointer;border:3px solid transparent}.hbox.active{border-color:yellow}
.boxPresent{background:#2e7d32;color:#fff}.boxAbsent{background:#c62828;color:#fff}.boxNotice{background:#ef6c00;color:#fff}
.subName{width:90px;padding:8px 6px;border-radius:6px;border:1.5px solid #0f5d1a;background:#e8f5e9;text-align:center;font-weight:700}
.subFull{width:70px;padding:7px;border-radius:6px;border:1.5px solid #b7791f;background:#fffbeb;text-align:center;font-weight:700}
.markGol{width:70px;height:38px;border-radius:6px;border:1.5px solid #94a3b8;background:#fff;text-align:center;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:12px;text-align:center;background:#fff}.tbl th{background:#0f5d1a;color:#fff;padding:10px 4px}.tbl td{padding:4px;border:1px solid #e2e8f0}
#institutePadFull{width:100%;max-width:800px;background:#fff;border:1px solid #ccc;overflow:hidden}
.padTop{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff}
.padLogo{width:95px;height:95px;border-radius:50%;border:3px solid #0a2a7a;object-fit:cover;flex-shrink:0;background:#fff}
.padText{flex:1;text-align:center;line-height:1.2;overflow:hidden;min-width:0}
.bnName{font-weight:700;color:#1a237e;font-size:17px;white-space:nowrap;display:block;width:100%;overflow:hidden}
.enName{font-weight:700;color:#b71c1c;font-size:13.5px;white-space:nowrap;display:block;width:100%;overflow:hidden;text-transform:uppercase}
.bnAddr{font-size:13px;color:#000;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line4{font-size:11px;color:#000;white-space:nowrap}.line5{font-size:11px;color:#000;white-space:nowrap}
.blueLine{width:100%;height:2px;background:#0d2a7a}
.classPillWrap{width:100%;display:flex;justify-content:center;padding:5px 0 8px 0;background:#fff}
.classPill{background:#0d2a7a;color:#fff;padding:5px 18px;border-radius:0 0 12px 12px;font-size:12px;font-weight:700}

/* === ৩টা বাটনের নতুন কালার - শুধু এইটুকু যোগ করা === */
#btnForm{ background:#0d8bf2 !important; border:3px solid #ffcc00; justify-content:center; color:#fff; }
#btnLogin{ background:#7c3aed !important; border:3px solid #ffcc00; justify-content:center; color:#fff; }
#btnList{ background:#dc2626 !important; border:3px solid #ffcc00; justify-content:center; color:#fff; }
#btnForm span, #btnLogin span, #btnList span{
  background:#000; color:#fff; padding:8px 22px; border-radius:30px; display:inline-block;
}
</style>
</head>
<body>

<div id="firstPageWrap" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div class="main-banner"><img src="badge.jpg"></div>
<div class="green-box"><span>টেক্সটাইল পলিটেকনিক হাজিরা</span></div>

<button id="btnForm" class="menu" onclick="document.getElementById('formBox').classList.toggle('hidden')"><span>🏫 প্রতিষ্ঠান ফরম ▼</span></button>
<div id="formBox" class="card hidden" style="text-align:center">
<img id="logoPreview"><label for="logoInput" style="background:#ffcc00;padding:7px 18px;border-radius:20px;cursor:pointer;font-weight:700">🖼️ লোগো চেঞ্জ ৯৫x৯৫ গোল</label><input type="file" id="logoInput" accept="image/*" style="position:absolute;left:-9999px;opacity:0">
<input id="bnName" placeholder="প্রতিষ্ঠানের নাম"><input id="enName" placeholder="English Name"><input id="address" placeholder="ঠিকানা">
<div class="fifty"><input id="eiin" placeholder="EIIN"><input id="schoolCode" placeholder="প্রতিষ্ঠান কোড"></div>
<div class="fifty"><input id="mobile" placeholder="মোবাইল"><input id="email" placeholder="Email"></div>
<input id="pass1" type="password" placeholder="পাসওয়ার্ড"><button class="btn green" onclick="savePrimary()">সেভ করুন ✅</button>
</div>

<button id="btnLogin" class="menu" onclick="document.getElementById('loginBox').classList.toggle('hidden')"><span>🔐 লগইন ▼</span></button>
<div id="loginBox" class="card hidden">
<input id="instCodeLogin" placeholder="🏫 প্রতিষ্ঠান কোড / EIIN" oninput="findInstByCode()"><div id="foundInstName" style="text-align:center;font-weight:700;min-height:18px;color:green"></div>
<div class="fifty"><select id="tradeSel"></select><select id="branchSel"><option>ক শাখা</option><option>খ শাখা</option></select></div>
<div class="fifty"><select id="semesterSel"></select><select id="sessionSel"></select></div>
<input id="loginPass" type="password" placeholder="🔑 পাসওয়ার্ড (কোডের নিচে)"><button class="btn blue" onclick="primaryLogin()">🔒 প্রবেশ করুন</button>
<p id="loginMsg" style="color:red;text-align:center"></p>
<div class="fifty"><button class="btn" style="background:#16a34a" onclick="editTrade()">🔧 ট্রেড এডিট (১০টা)</button><button class="btn" style="background:#ff7a00" onclick="editSession()">📅 সেশন এডিট (৪টা)</button></div>
</div>

<button id="btnList" class="menu" onclick="document.getElementById('listBox').classList.toggle('hidden')"><span>🔒 তালিকা ▼</span></button>
<div id="listBox" class="card hidden"><button class="btn red" onclick="openListSecure()">🔓 তালিকা খুলুন (এডমিন)</button><div id="instList"></div></div>
</div>

<div id="secondPageWrap" class="hidden" style="width:100%;display:flex;flex-direction:column;align-items:center">
<div id="institutePadFull">
  <div class="padTop"><img id="padLogo" class="padLogo"><div class="padText"><div id="instName" class="bnName"></div><div id="instEng" class="enName"></div><div id="instAddr" class="bnAddr"></div><div class="line4">EIIN: <span id="padEiin"></span> | Code: <span id="padCode"></span></div><div class="line5">Mobile: <span id="padMobile"></span> | Email: <span id="padEmail"></span></div></div></div>
  <div class="blueLine"></div>
  <div class="classPillWrap"><div class="classPill">ট্রেড: <span id="pillTrade"></span> | সেমি: <span id="pillSemester"></span> | সেশন: <span id="pillSession"></span> | শাখা: <span id="pillBranch"></span></div></div>
</div>
<div style="text-align:center;margin-top:8px"><button onclick="logout()" style="background:#d61f1f;color:#fff;border:none;padding:6px 14px;border-radius:8px">🚪 লগআউট</button></div>
<div id="acc" style="width:100%;max-width:430px;margin-top:10px"></div>
</div>

<script>
let trades=JSON.parse(localStorage.getItem('takrim_trades')||'null')||["টেক্সটাইল","গার্মেন্টস ডিজাইন","ইয়ার্ন ম্যানুফ্যাকচারিং","ফেব্রিক ম্যানুফ্যাকচারিং","ওয়েট প্রসেসিং","অ্যাপারেল ম্যানুফ্যাকচারিং","কম্পিউটার","ইলেকট্রিক্যাল","মেকানিক্যাল","সিভিল"];
let sessions=JSON.parse(localStorage.getItem('takrim_sessions')||'null')||["2022-23","2023-24","2024-25","2025-26"];
let semesters=["১ম সেমিস্টার","২য় সেমিস্টার","৩য় সেমিস্টার","৪র্থ সেমিস্টার","৫ম সেমিস্টার","৬ষ্ঠ সেমিস্টার","৭ম সেমিস্টার","৮ম সেমিস্টার"];
let insts=JSON.parse(localStorage.getItem('takrim_primary_insts')||'[]');
let students=JSON.parse(localStorage.getItem('students_v2')||'[]');
let activeTab='',tempLogo=localStorage.getItem('takrim_temp_logo')||'',currentInst=null;
function loadLoginSelects(){document.getElementById('tradeSel').innerHTML=trades.map(t=>`<option>${t}</option>`).join('');document.getElementById('semesterSel').innerHTML=semesters.map(s=>`<option>${s}</option>`).join('');document.getElementById('sessionSel').innerHTML=sessions.map(s=>`<option>${s}</option>`).join('');}
loadLoginSelects();
document.getElementById('logoInput').addEventListener('change',function(){if(!this.files[0])return;let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=600;c.height=600;let ctx=c.getContext('2d');let size=Math.min(img.width,img.height),sx=(img.width-size)/2,sy=(img.height-size)/2;ctx.fillStyle='#fff';ctx.fillRect(0,0,600,600);ctx.drawImage(img,sx,sy,size,size,0,0,600,600);tempLogo=c.toDataURL('image/png');let p=document.getElementById('logoPreview');p.src=tempLogo;p.style.display='block';localStorage.setItem('takrim_temp_logo',tempLogo);};img.src=e.target.result;};r.readAsDataURL(this.files[0]);});
function savePrimary(){let bn=document.getElementById('bnName').value.trim(),pass=document.getElementById('pass1').value.trim();if(!bn)return alert('প্রতিষ্ঠানের নাম দিন');if(!pass)return alert('পাসওয়ার্ড দিন');let o={bnName:bn,enName:document.getElementById('enName').value.trim(),addr:document.getElementById('address').value.trim(),eiin:document.getElementById('eiin').value.trim(),schoolCode:document.getElementById('schoolCode').value.trim(),mobile:document.getElementById('mobile').value.trim(),email:document.getElementById('email').value.trim(),pass:pass,logo:tempLogo||''};insts.push(o);localStorage.setItem('takrim_primary_insts',JSON.stringify(insts));localStorage.setItem('takrim_temp_logo','');alert('✅ সেভ');location.reload();}
function findInstByCode(){let code=document.getElementById('instCodeLogin').value.trim();currentInst=insts.find(x=>x.schoolCode==code||x.eiin==code);let el=document.getElementById('foundInstName');if(currentInst){el.innerText='✅ '+currentInst.bnName;el.style.color='green';}else{el.innerText=code?'❌ কোড পাওয়া যায়নি':'';el.style.color='red';}}
function primaryLogin(){if(!currentInst)return document.getElementById('loginMsg').textContent='❌ কোড দিন';if(document.getElementById('loginPass').value!==currentInst.pass)return document.getElementById('loginMsg').textContent='❌ ভুল পাস';localStorage.setItem('takrim_session',JSON.stringify({inst:currentInst,trade:document.getElementById('tradeSel').value,semester:document.getElementById('semesterSel').value,session:document.getElementById('sessionSel').value,branch:document.getElementById('branchSel').value}));showSecondPage();}
function autoFit(id,max,min){let el=document.getElementById(id);if(!el)return;let s=max;el.style.fontSize=s+'px';while(el.scrollWidth>el.parentElement.clientWidth&&s>min){s-=0.5;el.style.fontSize=s+'px';}}
function showSecondPage(){let sess=JSON.parse(localStorage.getItem('takrim_session')||'null');if(!sess)return;document.getElementById('firstPageWrap').classList.add('hidden');document.getElementById('secondPageWrap').classList.remove('hidden');document.body.style.background='#f0f4f8';document.getElementById('instName').innerText=sess.inst.bnName||'';document.getElementById('instEng').innerText=sess.inst.enName||'';document.getElementById('instAddr').innerText=sess.inst.addr||'';document.getElementById('padLogo').src=sess.inst.logo||'';document.getElementById('padEiin').innerText=sess.inst.eiin||'';document.getElementById('padCode').innerText=sess.inst.schoolCode||'';document.getElementById('padMobile').innerText=sess.inst.mobile||'';document.getElementById('padEmail').innerText=sess.inst.email||'';document.getElementById('pillTrade').innerText=sess.trade;document.getElementById('pillSemester').innerText=sess.semester;document.getElementById('pillSession').innerText=sess.session;document.getElementById('pillBranch').innerText=sess.branch;buildAcc();showStu();renderHeaderCounts();setTimeout(()=>{autoFit('instName',17,8);autoFit('instEng',13.5,7);},120);}
function openListSecure(){let a=prompt('এডমিন নাম'),p=prompt('পাসওয়ার্ড');if(a!=='malek'||p!=='takrim2022')return alert('ভুল এডমিন');document.getElementById('instList').innerHTML=insts.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee"><span>${s.bnName} (${s.schoolCode})</span><b style="color:red">${s.pass}</b></div>`).join('');}
function logout(){if(confirm('লগআউট?')){localStorage.removeItem('takrim_session');location.reload();}}
function buildAcc(){document.getElementById('acc').innerHTML=`<div class="acc"><div class="acc-h-normal" onclick="togN(1)"><span>1️⃣ শিক্ষার্থী যোগ</span><span>▼</span></div><div class="acc-b-normal" id="ab1"><input id="sn" placeholder="নাম"><input id="sr" placeholder="রোল"><input id="sm" placeholder="মোবাইল"><button class="btn green" onclick="addStu()">+ যোগ</button></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(2)"><span>2️⃣ তালিকা</span><span>▼</span></div><div class="acc-b-normal" id="ab2"><div id="sList"></div></div></div><div class="acc" style="border:3px solid #0d47a1"><div class="acc-h-normal" style="background:#0d47a1" onclick="togN(3)"><div class="header3"><div id="hb_present" class="hbox boxPresent" onclick="event.stopPropagation();setTab('present')">✅ উপস্থিত<br><span id="hc_present">0</span> জন</div><div id="hb_absent" class="hbox boxAbsent" onclick="event.stopPropagation();setTab('absent')">❌ অনুপস্থিত<br><span id="hc_absent">0</span> জন</div><div id="hb_notice" class="hbox boxNotice" onclick="event.stopPropagation();setTab('notice')">📢 নোটিশ</div></div></div><div class="acc-b" id="ab3"><div id="tabContent"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(4)"><span>4️⃣ মাসিক হাজিরা (১-৩১)</span><span>▼</span></div><div class="acc-b-normal" id="ab4"><input type="month" id="mp" value="${new Date().toISOString().slice(0,7)}" onchange="renderMonth()"><div id="monthTbl" style="margin-top:8px;overflow:auto"></div></div></div><div class="acc"><div class="acc-h-normal" onclick="togN(5)"><span>5️⃣ ফলাফল - আয়তক্ষেত্র + মোট % GPA</span><span>▼</span></div><div class="acc-b-normal" id="ab5"><div class="fifty"><b>বিষয়:</b><button onclick="chSub(-1)">-</button><input id="sc" type="number" value="3" style="text-align:center"><button onclick="chSub(1)">+</button><button onclick="makeSheet()" style="background:#7c4dff;color:#fff;border:none;padding:6px 14px;border-radius:8px">সেট</button><span id="lockB"></span></div><div id="pdfArea" style="margin-top:8px;overflow:auto;background:#fff;padding:8px"><table class="tbl" id="rt"><thead id="rh"></thead><tbody id="rb"></tbody></table></div><div class="fifty" style="margin-top:8px"><button style="background:#2e7d32;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="saveRes()">💾 সেভ লক</button><button style="background:#ff9800;color:#fff;padding:10px;border-radius:8px;border:none;flex:1" onclick="unlockRes()">✏️ এডিট</button></div><div class="fifty" style="margin-top:8px"><button style="background:#16a34a;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="expExcel()">⬇️ Excel A4</button><button style="background:#dc2626;color:#fff;padding:10px;border:none;border-radius:8px;flex:1" onclick="downPDF()">⬇️ PDF A4 প্যাড সহ</button></div><p id="st" style="font-size:11px;color:green;font-weight:bold;margin-top:4px"></p></div></div></div>`;}
function togN(i){let b=document.getElementById('ab'+i);b.classList.toggle(i==3?'show':'on');if(i==2)showStu();if(i==4)renderMonth();if(i==5)makeSheet();}
function setTab(t){if(activeTab===t){activeTab='';document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('ab3').classList.remove('show');return;}activeTab=t;document.querySelectorAll('.hbox').forEach(x=>x.classList.remove('active'));document.getElementById('hb_'+t).classList.add('active');document.getElementById('ab3').classList.add('show');renderTab();}
function renderHeaderCounts(){let p=students.filter(s=>s.present).length;document.getElementById('hc_present').innerText=p;document.getElementById('hc_absent').innerText=students.length-p;}
function renderTab(){let p=students.filter(s=>s.present),a=students.filter(s=>!s.present),el=document.getElementById('tabContent'),dateStr=new Date().toLocaleDateString('bn-BD');if(activeTab=='present'){el.innerHTML=`<div style="padding:10px;background:#e8f5e9;border-radius:12px">${p.map(s=>`✅ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই'}</div>`;}else if(activeTab=='absent'){el.innerHTML=`<div style="padding:10px;background:#ffebee;border-radius:12px">${a.map(s=>`❌ ${s.name} (${s.roll})`).join('<br>')||'কেউ নেই'}</div>`;}else{el.innerHTML=`<textarea id="notice" rows="3" style="width:100%;padding:10px;border-radius:12px;border:1px solid #ccc">${localStorage.getItem('notice')||''}</textarea><button onclick="localStorage.setItem('notice',document.getElementById('notice').value);alert('✅ সেভ')" style="width:100%;background:#ef6c00;color:#fff;padding:10px;border:none;border-radius:12px;margin-top:8px">💾 নোটিশ সেভ</button>`;}}
function showStu(){let sDiv=document.getElementById('sList');if(!sDiv)return;sDiv.innerHTML=students.map((s,i)=>`<div style="display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #eee"><span>${i+1}. ${s.name} (${s.roll})</span><div><input type="checkbox" ${s.present?'checked':''} onchange="students[${i}].present=this.checked;localStorage.setItem('students_v2',JSON.stringify(students));renderHeaderCounts()"><button onclick="students.splice(${i},1);localStorage.setItem('students_v2',JSON.stringify(students));showStu();renderHeaderCounts()" style="background:#fee2e2;border:none;padding:4px 8px;border-radius:8px">🗑️</button></div></div>`).join('')||'কোন শিক্ষার্থী নেই';}
function addStu(){let n=document.getElementById('sn').value.trim(),r=document.getElementById('sr').value.trim(),m=document.getElementById('sm').value.trim();if(!n)return alert('নাম দিন');students.push({name:n,roll:r,mobile:m,present:false});localStorage.setItem('students_v2',JSON.stringify(students));document.getElementById('sn').value='';document.getElementById('sr').value='';document.getElementById('sm').value='';showStu();renderHeaderCounts();}
function renderMonth(){let tbl=document.getElementById('monthTbl');if(!tbl)return;let html='<table class="tbl"><tr><th>নাম</th>';for(let d=1;d<=31;d++)html+=`<th>${d}</th>`;html+='</tr>';students.forEach(s=>{html+=`<tr><td>${s.name}</td>`;for(let d=1;d<=31;d++)html+=`<td><input type="checkbox" style="width:16px;height:16px"></td>`;html+='</tr>';});html+='</table>';tbl.innerHTML=html;}
function chSub(d){let el=document.getElementById('sc'),v=parseInt(el.value)||3;v+=d;if(v<1)v=1;if(v>10)v=10;el.value=v;}
function makeSheet(){let n=parseInt(document.getElementById('sc').value)||3,rh=document.getElementById('rh'),rb=document.getElementById('rb'),head='<tr><th>রোল</th><th>নাম</th>';for(let i=1;i<=n;i++)head+=`<th><input class="subName" id="subN${i}" placeholder="বিষয়${i}"><br><input class="subFull" id="subF${i}" placeholder="Full"></th>`;head+='<th>মোট</th><th>%</th><th>GPA</th></tr>';rh.innerHTML=head;let body='';students.forEach((s,i)=>{body+=`<tr><td>${s.roll}</td><td>${s.name}</td>`;for(let j=1;j<=n;j++)body+=`<td><input class="markGol" id="m_${i}_${j}" type="number"></td>`;body+=`<td id="tot_${i}"></td><td id="per_${i}"></td><td id="gpa_${i}"></td></tr>`;});rb.innerHTML=body;rb.querySelectorAll('.markGol').forEach(inp=>inp.addEventListener('input',calcRes));}
function calcRes(){let n=parseInt(document.getElementById('sc').value)||3;students.forEach((s,i)=>{let sum=0;for(let j=1;j<=n;j++){let el=document.getElementById(`m_${i}_${j}`);sum+=parseFloat(el?.value)||0;}document.getElementById(`tot_${i}`).innerText=sum;let full=0;for(let j=1;j<=n;j++)full+=parseFloat(document.getElementById(`subF${j}`)?.value)||100;let per=full?(sum/full*100):0;document.getElementById(`per_${i}`).innerText=per.toFixed(1)+'%';document.getElementById(`gpa_${i}`).innerText=per>=80?5:per>=70?4:per>=60?3.5:per>=50?3:per>=40?2:0;});}
function saveRes(){let data={sc:document.getElementById('sc').value,subs:[],marks:[]},n=parseInt(data.sc)||3;for(let i=1;i<=n;i++)data.subs.push({name:document.getElementById(`subN${i}`)?.value||'',full:document.getElementById(`subF${i}`)?.value||''});students.forEach((s,i)=>{let row=[];for(let j=1;j<=n;j++)row.push(document.getElementById(`m_${i}_${j}`)?.value||'');data.marks.push(row);});localStorage.setItem('fullResultSheet',JSON.stringify(data));document.getElementById('st').innerText='✅ সেভ হয়েছে';}
function unlockRes(){let d=JSON.parse(localStorage.getItem('fullResultSheet')||'null');if(!d)return;document.getElementById('sc').value=d.sc;makeSheet();setTimeout(()=>{d.subs.forEach((sb,i)=>{document.getElementById(`subN${i+1}`).value=sb.name;document.getElementById(`subF${i+1}`).value=sb.full;});d.marks.forEach((row,i)=>{row.forEach((v,j)=>{document.getElementById(`m_${i}_${j+1}`).value=v;});});calcRes();},200);}
function expExcel(){let tbl=document.getElementById('rt');let wb=XLSX.utils.table_to_book(tbl);XLSX.writeFile(wb,'Result_A4.xlsx');}
function downPDF(){let pad=document.getElementById('institutePadFull'),area=document.getElementById('pdfArea');html2canvas(pad).then(c1=>{html2canvas(area).then(c2=>{let {jsPDF}=window.jspdf, pdf=new jsPDF('p','mm','a4');pdf.addImage(c1.toDataURL('image/png'),'PNG',10,10,190,30);pdf.addImage(c2.toDataURL('image/png'),'PNG',10,45,190,200);pdf.save('Result_A4_Pad.pdf');});});}
function editTrade(){let inp=prompt('১০টা ট্রেড কমা দিয়ে:',trades.join(', '));if(!inp)return;trades=inp.split(',').map(s=>s.trim()).filter(s=>s).slice(0,10);localStorage.setItem('takrim_trades',JSON.stringify(trades));loadLoginSelects();}
function editSession(){let inp=prompt('৪টা সেশন কমা দিয়ে:',sessions.join(', '));if(!inp)return;sessions=inp.split(',').map(s=>s.trim()).filter(s=>s).slice(0,4);localStorage.setItem('takrim_sessions',JSON.stringify(sessions));loadLoginSelects();}
</script>
