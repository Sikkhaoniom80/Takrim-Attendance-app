<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>প্রাথমিক বিদ্যালয় হাজিরা</title>
<style>
  body{margin:0;background:#082a1e;font-family:'Hind Siliguri',sans-serif;display:flex;justify-content:center;padding:16px}
 .wrap{background:#1a7a3b;width:100%;max-width:380px;border-radius:28px;padding:24px 18px 100px;position:relative;min-height:90vh}
 .box{border:4px solid #ffcc00;border-radius:20px;padding:18px;margin-top:18px;display:flex;justify-content:center;align-items:center;cursor:pointer}
 .box.green{background:#22c55e}
 .box.blue{background:#4f7cff}
 .box.purple{background:#7c4dff}
 .pill{background:#000;color:#fff;border:2px solid #ffcc00;border-radius:999px;padding:10px 26px;font-weight:800;font-size:22px;text-align:center;line-height:1.3}
  /* আধুনিক তালিকা */
 .talika-modern{background:#E53935;border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(229,57,53,0.3);cursor:pointer;margin-top:22px}
 .talika-modern.left{color:#fff;font-weight:700;font-size:22px;display:flex;align-items:center;gap:12px}
 .talika-modern #instCount{background:#fff;color:#000;min-width:72px;height:38px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:900;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
</style>
</head>
<body>
<div class="wrap">

  <!-- ১. প্রাথমিক বিদ্যালয় হাজিরা -->
  <div class="box green">
    <div class="pill">প্রাথমিক বিদ্যালয়<br>হাজিরা</div>
  </div>

  <!-- ২. প্রতিষ্ঠান ফরম -->
  <div class="box blue" onclick="if(typeof showForm!=='undefined')showForm()">
    <div class="pill">প্রতিষ্ঠান ফরম</div>
  </div>

  <!-- ৩. লগইন -->
  <div class="box purple" onclick="if(typeof showLogin!=='undefined')showLogin()">
    <div class="pill">লগইন</div>
  </div>

  <!-- ৪. তালিকা - আধুনিক ডিজাইন -->
  <div class="talika-modern" onclick="showList()">
    <div class="left"><span style="font-size:26px">≡</span> তালিকা</div>
    <b id="instCount">০</b>
  </div>

</div>

<!-- ✅ এডমিন লগইন পপআপ -->
<div id="adminBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:16px;padding:22px;width:100%;max-width:360px">
    <h3 style="margin:0 0 14px">🔐 এডমিন লগইন</h3>
    <input id="adminUserInput" type="text" placeholder="ইউজারনেম" style="width:100%;padding:12px;border-radius:10px;border:2px solid #ccc;font-size:16px;margin-bottom:10px">
    <input id="adminPassInput" type="password" placeholder="পাসওয়ার্ড" style="width:100%;padding:12px;border-radius:10px;border:2px solid #ccc;font-size:16px">
    <div style="display:flex;gap:10px;margin-top:14px">
      <button onclick="checkAdmin()" style="flex:1;background:#E53935;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700">প্রবেশ</button>
      <button onclick="closeAdmin()" style="flex:1;background:#ddd;border:none;padding:12px;border-radius:10px">বাতিল</button>
    </div>
    <p id="adminErr" style="color:red;display:none;margin-top:10px">ভুল ইউজারনেম বা পাসওয়ার্ড!</p>
  </div>
</div>

<!-- ✅ প্রতিষ্ঠানের তালিকা -->
<div id="listBox" style="display:none;position:fixed;inset:0;background:#f5f5f5;z-index:9998;overflow:auto;padding:16px">
  <div style="display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#f5f5f5;padding:10px 0">
    <h2 style="margin:0">📋 তালিকা (<span id="totalCount">0</span>)</h2>
    <button onclick="closeList()" style="background:#000;color:#fff;border:none;padding:8px 14px;border-radius:8px">✕ বন্ধ</button>
  </div>
  <div id="instTable" style="margin-top:16px"></div>
</div>

<script>
  const ADMIN_USER = "malek";
  const ADMIN_PASS = "takrim2022";

  function toBn(n){ return n.toString().replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]); }

  function updateInstCount(){
    let insts = JSON.parse(localStorage.getItem('insts') || '[]');
    let c=document.getElementById('instCount');
    if(c) c.innerText = toBn(insts.length);
  }

  function showList(){
    document.getElementById('adminBox').style.display='flex';
    document.getElementById('adminUserInput').value='';
    document.getElementById('adminPassInput').value='';
    document.getElementById('adminErr').style.display='none';
  }
  function closeAdmin(){ document.getElementById('adminBox').style.display='none'; }
  function closeList(){ document.getElementById('listBox').style.display='none'; }

  function checkAdmin(){
    let u = document.getElementById('adminUserInput').value.trim();
    let p = document.getElementById('adminPassInput').value.trim();
    if(u === ADMIN_USER && p === ADMIN_PASS){
      closeAdmin();
      openInstList();
    }else{
      document.getElementById('adminErr').style.display='block';
    }
  }

  function openInstList(){
    let insts = JSON.parse(localStorage.getItem('insts') || '[]');
    document.getElementById('totalCount').innerText = toBn(insts.length);
    let html = '';
    if(insts.length===0){
      html = '<p>কোন প্রতিষ্ঠান নেই</p>';
    }else{
      insts.forEach((it, idx)=>{
        html += `
        <div style="background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,0.1);display:flex;justify-content:space-between;align-items:center">
          <div>
            <b>🏫 ${it.name || 'নাম নেই'}</b><br>
            <small>কোড: ${it.code || '-'} | পাস: ${it.password || '-'}</small>
          </div>
          <button onclick="deleteInst(${idx})" style="background:#E53935;color:#fff;border:none;padding:8px 12px;border-radius:8px">ডিলিট</button>
        </div>`;
      });
    }
    document.getElementById('instTable').innerHTML = html;
    document.getElementById('listBox').style.display='block';
  }

  function deleteInst(i){
    if(confirm('এই প্রতিষ্ঠান ডিলিট করবে?')){
      let insts = JSON.parse(localStorage.getItem('insts') || '[]');
      insts.splice(i,1);
      localStorage.setItem('insts', JSON.stringify(insts));
      openInstList();
      updateInstCount();
    }
  }

  // পেজ লোডে সংখ্যা আপডেট
  updateInstCount();
</script>
</body>
</html>
