<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⭐ TAKRIM ATTENDANCE ⭐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0a1e42;min-height:100vh;padding:15px;color:#333}
.title-card{background:#0d2a5c;border:4px solid #FFD54F;border-radius:25px;padding:30px 15px;text-align:center;margin-bottom:20px}
.title-card h1{color:#FFD54F;font-size:32px;letter-spacing:2px}
.title-card p{color:#fff;margin-top:8px;font-size:15px}
.pill{display:inline-block;background:#000;border:2px solid #FFD54F;color:#FFD54F;border-radius:20px;padding:6px 20px;margin-top:12px;font-size:14px}
.menu-btn{display:block;width:100%;background:#fff;border:4px solid #FFD54F;border-radius:18px;padding:16px;font-size:19px;font-weight:bold;color:#111;margin-bottom:14px;cursor:pointer;text-align:left}
.card{background:#fff;border-radius:18px;padding:18px;margin-bottom:15px}
h2,h3{color:#1a3a6b;margin-bottom:10px}
label{display:block;font-weight:bold;margin:8px 0 4px;color:#1a3a6b}
input,select{width:100%;padding:12px;border:2px solid #ddd;border-radius:12px;font-size:16px;margin-bottom:6px}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#FFD54F,#FFB300);border:none;border-radius:12px;font-size:17px;font-weight:bold;color:#1a3a6b;margin-top:10px;cursor:pointer}
.btn-blue{background:linear-gradient(135deg,#1a3a6b,#2a5aa8);color:#fff}
.stu{display:flex;align-items:center;gap:8px;padding:10px;border:2px solid #eee;border-radius:12px;margin-bottom:8px}
.stu.nm{flex:1;font-weight:bold}
.pa{padding:8px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.p-on{background:#4CAF50;color:#fff}.p-off{background:#eee;color:#888}
.a-on{background:#f44336;color:#fff}.a-off{background:#eee;color:#888}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.topbar button{background:#FFD54F;border:none;border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>

<!-- হোম -->
<div id="home">
<div class="title-card">
<h1>⭐ TAKRIM<br>ATTENDANCE ⭐</h1>
<p>স্কুল • কলেজ • মাদ্রাসা • কোচিং</p>
<span class="pill">Engineered by Takrim-ai</span>
</div>
<button class="menu-btn" onclick="go('newInstScr')">➕ নতুন প্রতিষ্ঠান যোগ করুন</button>
<button class="menu-btn" onclick="openClassScr()">🎓 শ্রেণী সিলেক্ট করে হাজিরা</button>
<button class="menu-btn" onclick="go('loginScr')">🔑 প্রতিষ্ঠান লগইন</button>
<button class="menu-btn" onclick="openListScr()">🏫 প্রতিষ্ঠানের তালিকা দেখুন</button>
</div>

<!-- নতুন প্রতিষ্ঠান -->
<div id="newInstScr" style="display:none">
<div class="topbar"><button onclick="go('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">➕ নতুন প্রতিষ্ঠান</h2><span></span></div>
<div class="card">
<div style="border:2px solid #FFD54F;border-radius:22px;padding:18px;margin-bottom:12px">
<div style="display:flex;gap:14px;align-items:center">
<div style="text-align:center;min-width:90px">
<label for="npLogoInp" style="cursor:pointer;display:block">
<img id="npLogo" src="data:image/gif;base64,[STRIPPED]" style="width:80px;height:80px;border-radius:50%;border:5px solid #FFD54F;object-fit:cover;background:#f5f5f5;display:block;margin:0 auto">
<div style="color:#1a3aed;font-weight:bold;margin-top:6px;font-size:14px">লোগো চেঞ্জ</div>
</label>
<input type="file" id="npLogoInp" accept="image/*" onchange="npLogoChg(this)" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
</div>
<div style="flex:1">
<input id="npBn" placeholder="বাংলা নাম" style="text-align:center;font-weight:bold">
<input id="npEn" placeholder="English Name" style="text-align:center">
<div style="display:flex;gap:8px">
<input id="npEi" placeholder="EIIN" style="text-align:center;margin:0">
<input id="npCd" placeholder="Code" style="text-align:center;margin:0">
</div></div></div></div>
<label>🔑 পাসওয়ার্ড</label><input id="npPass" type="password" placeholder="পাসওয়ার্ড দিন">
<button class="btn btn-blue" onclick="saveNewInst()">সেভ করুন ✔️</button>
</div></div>

<!-- শ্রেণী সিলেক্ট (ছবির মতোই — শুধু শ্রেণীর ঘর) -->
<div id="classScr" style="display:none">
<div class="topbar"><button onclick="go('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">🎓 শ্রেণী সিলেক্ট করুন</h2><span></span></div>
<div class="card" id="classGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"></div>
</div>

<!-- লগইন -->
<div id="loginScr" style="display:none">
<div class="topbar"><button onclick="go('home')">⬅ ফিরুন</button><span></span><span></span></div>
<div class="card" style="text-align:center;border:3px solid #FFD54F">
<div style="font-size:50px">🔐</div><h2>প্রতিষ্ঠান লগইন</h2>
<label style="text-align:left">🏫 প্রতিষ্ঠান কোড</label><input id="l_code" placeholder="যেমন: 50018">
<label style="text-align:left">🔑 পাসওয়ার্ড</label><input id="l_pass" type="password" placeholder="পাসওয়ার্ড দিন">
<button class="btn" onclick="teacherLogin()">প্রবেশ করুন ➜</button>
<p id="l_msg" style="color:red;font-size:14px;margin-top:8px"></p>
</div></div>

<!-- তালিকা -->
<div id="listScr" style="display:none">
<div class="topbar"><button onclick="go('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">🏫 তালিকা</h2><span></span></div>
<div class="card"><div id="instList"></div></div>
</div>

<!-- হাজিরা -->
<div id="attScr" style="display:none">
<div class="topbar"><button onclick="go('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">📋 হাজিরা</h2><span></span></div>
<div class="card" id="attPad"></div>
<div class="card">
<label>📅 তারিখ</label><input type="date" id="attDate">
<label>ছাত্রের নাম</label>
<div style="display:flex;gap:8px"><input id="stuName" placeholder="নাম লিখুন" style="margin:0"><button class="btn btn-blue" style="width:auto;margin:0;padding:12px 18px" onclick="addStudent()">যোগ ➕</button></div>
</div>
<div class="card"><h3>👨‍🎓 ছাত্র তালিকা</h3><div id="stuList"></div>
<button class="btn" onclick="saveAtt()">হাজিরা সেভ ✔️</button>
<button class="btn btn-blue" onclick="downloadCSV()">⬇️ রিপোর্ট ডাউনলোড (CSV)</button>
</div></div>

<script>
let users=JSON.parse(localStorage.getItem('takrim_users')||'{}');
let insts=JSON.parse(localStorage.getItem('takrim_insts')||'[]');
let cur=-1, students=[], att={}, curCls='';
const CLASSES=['১ম শ্রেণী','২য় শ্রেণী','৩য় শ্রেণী','৪র্থ শ্রেণী','৫ম শ্রেণী','৬ষ্ঠ শ্রেণী','৭ম শ্রেণী','৮ম শ্রেণী','৯ম শ্রেণী','১০ম শ্রেণী','একাদশ শ্রেণী','দ্বাদশ শ্রেণী'];
function go(id){['home','newInstScr','classScr','loginScr','listScr','attScr'].forEach(s=>document.getElementById(s).style.display='none');document.getElementById(id).style.display='block';}
/* নতুন প্রতিষ্ঠান */
let npLogoData='';
function npLogoChg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{npLogoData=r.result;document.getElementById('npLogo').src=r.result;};r.readAsDataURL(f);}
function saveNewInst(){const bn=npBn.value.trim();if(!bn){alert('প্রতিষ্ঠানের নাম দিন');return;}
insts.push({name:bn,en:npEn.value.trim(),eiin:npEi.value.trim(),code:npCd.value.trim(),logo:npLogoData,pass:npPass.value,cls:''});
localStorage.setItem('takrim_insts',JSON.stringify(insts));
if(npCd.value.trim()&&npPass.value){users[npCd.value.trim()]=npPass.value;localStorage.setItem('takrim_users',JSON.stringify(users));}
npBn.value='';npEn.value='';npEi.value='';npCd.value='';npPass.value='';npLogoData='';npLogo.src='data:image/gif;base64,[STRIPPED]';
alert('✔️ প্রতিষ্ঠান যোগ হয়েছে');go('home');}
/* শ্রেণী সিলেক্ট — শুধু শ্রেণীর ঘর, যেটায় ক্লিক হবে সেটা প্যাডে সেভ হবে */
function openClassScr(){if(!insts.length){alert('আগে নতুন প্রতিষ্ঠান যোগ করুন');go('newInstScr');return;}
cur=0;go('classScr');
classGrid.innerHTML=CLASSES.map(c=>'<button class="btn" style="margin:0" onclick="enterClass(\''+c+'\')">🎓 '+c+'</button>').join('');}
function enterClass(c){curCls=c;
students=JSON.parse(localStorage.getItem('takrim_stu_'+cur+'_'+c)||'[]');att={};
buildPad();go('attScr');
showClass.textContent=c;
attDate.value=new Date().toISOString().slice(0,10);renderStu();}
/* লগইন */
function teacherLogin(){const c=l_code.value.trim(),p=l_pass.value;
if(!c||!p){l_msg.textContent='কোড ও পাসওয়ার্ড দিন';return;}
if(users[c]&&users[c]===p){go('home');l_msg.textContent='';alert('✔️ লগইন সফল!');}
else{l_msg.textContent='❌ ভুল কোড বা পাসওয়ার্ড!';}}
/* তালিকা */
function openListScr(){go('listScr');
instList.innerHTML=insts.length?insts.map((s,i)=>'<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px">'+(s.logo?'<img src="'+s.logo+'" style="width:45px;height:45px;border-radius:50%;object-fit:cover">':'🏫')+'<div style="flex:1"><b>'+s.name+'</b><br><small>EIIN: '+(s.eiin||'-')+' | Code: '+(s.code||'-')+'</small></div><button class="btn" style="width:auto;padding:8px 14px;margin:0" onclick="openInstAtt('+i+')">হাজিরা ➜</button></div>').join(''):'<p style="text-align:center;color:#888">এখনো কোনো প্রতিষ্ঠান নেই</p>';}
function openInstAtt(i){cur=i;openClassScr();}
/* হাজিরা প্যাড — শুধু সিলেক্ট করা শ্রেণী, ভেতরে আর কিছু নেই */
function buildPad(){
attPad.innerHTML='<p style="margin:0;font-weight:700;font-size:18px;color:#1a3a6b;text-align:center">🎓 শ্রেণী: <span id="showClass"></span></p>';}
/* ছাত্র ও হাজিরা */
function addStudent(){const n=stuName.value.trim();if(!n)return;
students.push(n);localStorage.setItem('takrim_stu_'+cur+'_'+curCls,JSON.stringify(students));stuName.value='';renderStu();}
function renderStu(){stuList.innerHTML=students.map((n,i)=>'<div class="stu"><span class="nm">'+(i+1)+'. '+n+'</span><button class="pa '+(att[n]=='A'?'p-off':'p-on')+'" onclick="mark(\''+n+'\',\'P\')">✔️</button><button class="pa '+(att[n]=='A'?'a-on':'a-off')+'" onclick="mark(\''+n+'\',\'A\')">✖️</button></div>').join('')||'<p style="color:#888">ছাত্র যোগ করুন</p>';}
function mark(n,v){att[n]=v;renderStu();}
function saveAtt(){const rec=JSON.parse(localStorage.getItem('takrim_att_'+cur+'_'+curCls)||'{}');rec[attDate.value]=att;
localStorage.setItem('takrim_att_'+cur+'_'+curCls,JSON.stringify(rec));alert('✔️ হাজিরা সেভ হয়েছে');}
function downloadCSV(){let csv='শ্রেণী: '+curCls+'\nনাম,অবস্থা\n';students.forEach(n=>{csv+=n+','+(att[n]=='A'?'অনুপস্থিত':'উপস্থিত')+'\n';});
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='hazira_'+curCls+'_'+attDate.value+'.csv';a.click();}
</script>
</body>
</html>
