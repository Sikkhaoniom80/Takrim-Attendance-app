<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malek 50K - Final 3 Page Class Wise</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.badge{width:100%;max-width:480px;border-radius:18px;border:2px solid #ffd700;margin-top:6px;display:block;box-shadow:0 0 25px rgba(212,175,55,.35)}
.logo{width:360px;max-width:92%;border-radius:22px;border:3px solid #ffd700;margin-top:10px}
.menu-btn{display:block;width:100%;max-width:380px;background:#fff;border:3px solid #ffd700;border-radius:18px;padding:16px;font-size:19px;font-weight:bold;color:#111;margin-top:14px;cursor:pointer;text-align:center}
.menu-btn small{display:block;font-size:12px;color:#555;font-weight:normal;margin-top:4px}
.page{display:none;width:100%;max-width:480px}.page.active{display:flex;flex-direction:column;align-items:center;width:100%}
.header{background:#0f3d2e;color:white;padding:25px 15px 50px;text-align:center;border-radius:0 0 25px 25px;width:100%}
.card{background:white;margin:-25px 12px 15px;border-radius:18px;padding:15px;width:100%}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.sms-btns{display:flex;gap:8px}.sms-btns button{flex:1;padding:12px;border:none;border-radius:10px;color:white;font-weight:bold}
.green{background:#16a34a}.orange{background:#ea580c}.yellow{background:#eab308;color:#000!important}
.student-row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #eee}
.filter-tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}.filter-tabs button{flex:1;min-width:70px;padding:10px 6px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
.college-pad{background:#fff!important;border-radius:14px!important;padding:8px 12px!important;display:flex!important;align-items:center!important;gap:10px!important;box-shadow:0 3px 10px rgba(0,0,0,.2)!important;width:100%}
.college-pad img{width:56px!important;height:56px!important;border-radius:50%!important;border:3px solid #ffcc00!important;object-fit:cover!important;flex-shrink:0;background:white}
.pad-bn{font-size:11.5px!important;font-weight:700!important;color:#0f2d5a!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
.pad-en{font-size:9px!important;font-weight:700!important;color:#cc0000!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
#monthlyDivFirst{display:none}
#studentList{display:none!important} #studentList.show{display:block!important}
#resultDiv{display:none}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;width:100%}
.topbar button{background:#ffcc00;border:none;border-radius:10px;padding:8px 14px;font-weight:bold;cursor:pointer}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,#ffcc00,#ffb300);border:none;border-radius:12px;font-size:17px;font-weight:bold;color:#0f2d5a;margin-top:10px;cursor:pointer}
.btn-blue{background:linear-gradient(135deg,#0f3d2e,#1a6b4f);color:#fff}
.pa{padding:8px 14px;border-radius:10px;border:none;font-weight:bold;cursor:pointer}
.a-on{background:#f44336;color:#fff}
.one-line{background:#ffcc00;color:#0f2d5a;border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;margin:10px 0 0;line-height:1.6}
</style>
</head>
<body>

<!-- 🏠 ১ম পাতা: ব্যাজ + ৪টা মেনু -->
<div id="home" class="page active">
<img class="badge" src="badge.jpg" alt="Malek Admission System" onerror="this.style.display='none'">
<button class="menu-btn" onclick="show('newInstScr')">➕ প্রতিষ্ঠান যোগ করুন<small>লোগো, বাংলা-ইংরেজি নাম, EIIN, কোড, পাসওয়ার্ড</small></button>
<button class="menu-btn" onclick="show('classSelScr')">🎓 ট্রেড / সেশন / সেমিস্টার<small>১০টি ট্রেড, ৮টি সেশন, ৮টি সেমিস্টার</small></button>
<button class="menu-btn" onclick="show('loginScr')">🔑 প্রতিষ্ঠান লগইন<small>কোড ও পাসওয়ার্ড দিয়ে প্রবেশ</small></button>
<button class="menu-btn" onclick="adminGate()">🏫 প্রতিষ্ঠানের তালিকা দেখুন<small>শুধুমাত্র এডমিনের জন্য 🔒</small></button>
<p id="selInfo" style="color:#ffcc00;font-size:13px;font-weight:bold;text-align:center;margin:12px 6px 0"></p>
</div>

<!-- ১। ➕ নতুন প্রতিষ্ঠান -->
<div id="newInstScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">➕ নতুন প্রতিষ্ঠান</h2><span></span></div>
<div class="card">
<div style="border:2px solid #ffcc00;border-radius:22px;padding:18px;margin-bottom:12px">
<div style="display:flex;gap:14px;align-items:center">
<div style="text-align:center;min-width:90px">
<label for="npLogoInp" style="cursor:pointer;display:block">
<img id="npLogo" src="data:image/gif;base64,[STRIPPED]" style="width:80px;height:80px;border-radius:50%;border:5px solid #ffcc00;object-fit:cover;background:#f5f5f5;display:block;margin:0 auto">
<div style="color:#1a3aed;font-weight:bold;margin-top:6px;font-size:14px">লোগো চেঞ্জ</div>
</label>
<input type="file" id="npLogoInp" accept="image/*" onchange="npLogoChg(this)" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
</div>
<div style="flex:1">
<input id="npBn" placeholder="বাংলা নাম" style="text-align:center;font-weight:bold">
<input id="npEn" placeholder="English Name" style="text-align:center">
<div style="display:flex;gap:8px">
<input id="npEi" placeholder="EIIN" style="text-align:center;margin:0">
<input id="npCd" placeholder="Code" style="text-align:center;margin:0">
</div></div></div></div>
<label style="font-weight:bold">🔑 পাসওয়ার্ড</label><input id="npPass" type="password" placeholder="পাসওয়ার্ড দিন">
<button class="btn btn-blue" onclick="saveNewInst()">সেভ করুন ✔️</button>
</div></div>

<!-- ২। 🎓 ট্রেড / সেশন / সেমিস্টার সিলেক্ট -->
<div id="classSelScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">🎓 ট্রেড সিলেক্ট</h2><span></span></div>
<div class="card" style="border:3px solid #ffcc00;margin-top:0">
<label style="font-weight:bold">🔧 ট্রেডের নাম (১০টি)</label><select id="s_trade"></select>
<label style="font-weight:bold">📅 সেশন (৮টি)</label><select id="s_session"></select>
<label style="font-weight:bold">📚 সেমিস্টার (৮টি)</label><select id="s_sem"></select>
<button class="btn btn-blue" onclick="saveSel()">✅ নিশ্চিত করুন</button>
</div></div>

<!-- ৩। 🔑 প্রতিষ্ঠান লগইন -->
<div id="loginScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><span></span><span></span></div>
<div class="card" style="text-align:center;border:3px solid #ffcc00;margin-top:0">
<div style="font-size:50px">🔐</div><h2>প্রতিষ্ঠান লগইন</h2>
<label style="text-align:left;font-weight:bold">🏫 প্রতিষ্ঠান কোড</label><input id="l_code" placeholder="যেমন: 50018">
<label style="text-align:left;font-weight:bold">🔑 পাসওয়ার্ড</label><input id="l_pass" type="password" placeholder="পাসওয়ার্ড দিন">
<p style="font-size:13px;color:#555">ℹ️ আগে ২ নম্বর মেনু থেকে ট্রেড/সেশন/সেমিস্টার সিলেক্ট করুন</p>
<button class="btn" onclick="teacherLogin()">প্রবেশ করুন ➜</button>
<p id="l_msg" style="color:red;font-size:14px;margin-top:8px"></p>
</div></div>

<!-- ৪। 🏫 তালিকা (এডমিন) -->
<div id="listScr" class="page">
<div class="topbar"><button onclick="show('home')">⬅ ফিরুন</button><h2 style="color:#fff;margin:0">🏫 তালিকা</h2><span></span></div>
<div class="card"><div id="instList"></div></div>
</div>

<!-- ২য় পাতা (ফিক্সড): হাজিরা ড্যাশবোর্ড -->
<div id="firstPage" class="page">
<div class="header" style="padding:10px 10px 35px">
<div class="college-pad"><div onclick="logoInput.click()" style="cursor:pointer;text-align:center;min-width:60px"><img id="boxLogo" src="https://via.placeholder.com/65"><div style="font-size:9px;color:blue">লোগো চেঞ্জ</div><input type="file" id="logoInput" accept="image/*" style="display:none" onchange="changeBoxLogo(this)"></div>
<div style="flex:1;overflow:hidden"><div id="boxNameBn" class="pad-bn" contenteditable="true" onblur="saveBox()">মালেকে বানু উচ্চ বিদ্যালয়</div><div id="boxNameEn" class="pad-en" contenteditable="true" onblur="saveBox()">Mallika banu Uchch vidyalay</div><div style="display:flex;gap:10px;margin-top:2px;font-size:10px;color:#333"><span>EIIN: <b><span id="boxEIIN" contenteditable="true" onblur="saveBox()">132322</span></b></span><span>Code: <b><span id="boxIns" contenteditable="true" onblur="saveBox()">50018</span></b></span></div></div></div>
<p id="boxStatus" style="color:#ffcc00;font-size:12px;height:12px;margin:5px 0 0"></p>
<p class="one-line">🎓 <span id="showClass"></span></p></div>
<div class="card">
<button class="yellow-btn" onclick="openStudentPage()">👥 শিক্ষার্থীর তালিকা দেখুন</button>
<button onclick="toggleMonthlyFirst()" style="width:100%;margin-top:12px;padding:14px;background:#fff;border:2px dashed #2563eb;border-radius:12px;font-weight:bold;color:#2563eb">📋 মাসিক হাজিরা দেখুন</button>
<div id="monthlyDivFirst" style="overflow:auto;margin-top:10px;border:2px dashed #2563eb;border-radius:12px;padding:10px;background:#f8fafc"></div>
<h3>📢 নোটিশ বোর্ড</h3><input type="text" id="noticeText" placeholder="নোটিশ লিখুন...">
<h3>💬 SMS পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendDirectSMS('present')">✅ উপস্থিত</button><button class="orange" onclick="sendDirectSMS('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendDirectSMS('notice')">📢 নোটিশ</button></div>
<h3>📲 WhatsApp-এ পাঠান</h3><div class="sms-btns"><button class="green" onclick="sendWA('present')">✅ উপস্থিত</button><button class="orange" onclick="sendWA('absent')">❌ অনুপস্থিত</button><button class="yellow" onclick="sendWA('notice')">📢 নোটিশ</button></div>
<button onclick="shareReport()" style="width:100%;margin-top:10px;padding:14px;background:#25D366;color:white;border:none;border-radius:12px;font-weight:bold">📊 হাজিরা রিপোর্ট WhatsApp গ্রুপে দিন</button>
<button onclick="location.reload()" style="width:100%;margin-top:12px;padding:10px;background:#555;color:white;border:none;border-radius:10px">⬅️ লগআউট</button>
</div></div>

<!-- ৩য় পাতা (ফিক্সড): শিক্ষার্থীর তালিকা -->
<div id="secondPage" class="page">
<div class="header" style="padding-bottom:20px"><div class="college-pad"><img id="boxLogo3"><div style="flex:1;overflow:hidden"><div id="boxNameBn3" class="pad-bn"></div><div id="boxNameEn3" class="pad-en"></div><div style="font-size:10px;color:#333"><span id="boxEIIN3"></span> | <span id="boxIns3"></span></div></div></div>
<h2 style="margin:10px 0 0">শিক্ষার্থীর তালিকা</h2><div style="color:#0f2d5a;font-size:13px;margin-top:6px;font-weight:700;background:#ffcc00;border-radius:10px;padding:8px 12px">🎓 <span id="showClass3"></span></div>
<button onclick="show('firstPage')" style="margin-top:10px;background:white;color:#0f3d2e;border:none;padding:6px 15px;border-radius:20px;font-weight:bold">⬅️ ড্যাশবোর্ড</button></div>
<div class="card">
<button onclick="toggleAdd()" style="width:100%;padding:14px;background:#dcfce7;border:2px dashed #16a34a;border-radius:12px;font-weight:bold">➕ শিক্ষার্থী যোগ করুন</button>
<div id="addForm" style="display:none;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;border:1px solid #16a34a"><input type="text" id="sName" placeholder="নাম"><input type="text" id="sRoll" placeholder="রোল"><input type="text" id="sMobile" placeholder="মোবাইল"><div style="display:flex;gap:8px"><button onclick="addStudent()" style="flex:1;padding:12px;background:#16a34a;color:white;border:none;border-radius:8px">✅ যোগ</button><button onclick="toggleAdd()" style="flex:1;padding:12px;background:#555;color:white;border:none;border-radius:8px">❌ বন্ধ</button></div></div>
<div class="filter-tabs"><button style="background:#ffcc00" onclick="filterList('all')">📋 সবাই<br><span id="cAll">0</span></button><button style="background:#16a34a;color:white" onclick="filterList('present')">✅ উপস্থিত<br><span id="cPresent">0</span></button><button style="background:#ef4444;color:white" onclick="filterList('absent')">❌ অনুপস্থিত<br><span id="cAbsent">0</span></button><button style="background:#7c3aed;color:white" onclick="filterList('result')">🏆 ফলাফল</button></div>
<div id="studentList"></div><div id="resultDiv" style="overflow:auto;margin-top:10px;border:2px solid #7c3aed;border-radius:12px;padding:10px;background:#f5f3ff"></div>
</div></div>

<script>
/* ===== পেজ নেভিগেশন ===== */
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}

/* ===== প্রতিষ্ঠান ম্যানেজমেন্ট ===== */
let users=JSON.parse(localStorage.getItem('takrim_users')||'{}');
let insts=JSON.parse(localStorage.getItem('takrim_insts')||'[]');

/* ===== ২। ট্রেড / সেশন / সেমিস্টার (১০টি ট্রেড, ৮টি সেশন, ৮টি সেমিস্টার) ===== */
const TRADES=['কম্পিউটার টেকনোলজি','ইলেকট্রিক্যাল টেকনোলজি','মেকানিক্যাল টেকনোলজি','সিভিল টেকনোলজি','অটোমোবাইল টেকনোলজি','ইলেকট্রনিক্স টেকনোলজি','গার্মেন্টস ডিজাইন','রেফ্রিজারেশন ও এয়ারকন্ডিশন','ওয়েল্ডিং ও ফেব্রিকেশন','প্লাম্বিং ও পাইপ ফিটিং'];
const SESSIONS=['2025-26','2024-25','2023-24','2022-23','2021-22','2020-21','2019-20','2018-19'];
const SEMS=['০১','০২','০৩','০৪','০৫','০৬','০৭','০৮'];
s_trade.innerHTML='<option value="">ট্রেড সিলেক্ট করুন</option>'+TRADES.map(t=>'<option value="'+t+'">'+t+'</option>').join('');
s_session.innerHTML='<option value="">সেশন সিলেক্ট করুন</option>'+SESSIONS.map(s=>'<option value="'+s+'">সেশন '+s+'</option>').join('');
s_sem.innerHTML='<option value="">সেমিস্টার সিলেক্ট করুন</option>'+SEMS.map(s=>'<option value="'+s+'">সেমিস্টার '+s+'</option>').join('');
function getSel(){return JSON.parse(localStorage.getItem('takrim_sel')||'{}');}
function saveSel(){
  if(!s_trade.value){alert('ট্রেড সিলেক্ট করুন');return;}
  if(!s_session.value){alert('সেশন সিলেক্ট করুন');return;}
  if(!s_sem.value){alert('সেমিস্টার সিলেক্ট করুন');return;}
  localStorage.setItem('takrim_sel',JSON.stringify({t:s_trade.value,s:s_session.value,sm:s_sem.value}));
  updateSelInfo();alert('✔️ সিলেক্ট হয়েছে');show('home');
}
function updateSelInfo(){
  let sel=getSel();
  selInfo.textContent=sel.t?('✅ '+sel.t+' | সেশন '+sel.s+' | সেমিস্টার '+sel.sm):'';
  if(sel.t){s_trade.value=sel.t;s_session.value=sel.s;s_sem.value=sel.sm;}
}

let npLogoData='';
function npLogoChg(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{npLogoData=e.target.result;document.getElementById('npLogo').src=e.target.result;};r.readAsDataURL(f);}
function saveNewInst(){let bn=npBn.value.trim();if(!bn){alert('প্রতিষ্ঠানের নাম দিন');return;}
insts.push({name:bn,en:npEn.value.trim(),eiin:npEi.value.trim(),code:npCd.value.trim(),logo:npLogoData,pass:npPass.value});
localStorage.setItem('takrim_insts',JSON.stringify(insts));
if(npCd.value.trim()&&npPass.value){users[npCd.value.trim()]=npPass.value;localStorage.setItem('takrim_users',JSON.stringify(users));}
npBn.value='';npEn.value='';npEi.value='';npCd.value='';npPass.value='';npLogoData='';npLogo.src='data:image/gif;base64,[STRIPPED]';
alert('✔️ প্রতিষ্ঠান যোগ হয়েছে');show('home');}

/* ===== ৩। প্রতিষ্ঠান লগইন (কোড+পাসওয়ার্ড) → ২য় পেজ ===== */
function teacherLogin(){let c=l_code.value.trim(),p=l_pass.value;
if(!c||!p){l_msg.textContent='কোড ও পাসওয়ার্ড দিন';return;}
let sel=getSel();
if(!sel.t){l_msg.textContent='⚠️ আগে ২ নম্বর মেনু থেকে ট্রেড/সেশন/সেমিস্টার সিলেক্ট করুন';setTimeout(()=>show('classSelScr'),900);return;}
let i=insts.findIndex(s=>((s.code||'').trim()===c));
let ok=(users[c]&&users[c]===p);
if(!ok&&i>=0&&(insts[i].pass||'')===p)ok=true;
if(!ok){l_msg.textContent='❌ ভুল কোড বা পাসওয়ার্ড!';return;}
l_msg.textContent='';l_code.value='';l_pass.value='';
let s=insts[i>=0?i:0]||{};
localStorage.setItem('collegeInfo',JSON.stringify({nameBn:s.name||'',nameEn:s.en||'',eiin:s.eiin||'',ins:s.code||'',logo:s.logo||''}));
currentClass=sel.t+' | সেশন '+sel.s+' | সেমিস্টার '+sel.sm;
loadClassData();showClass.innerText=currentClass;showClass3.innerText=currentClass;
loadBox();fixDateBug();show('firstPage');}

/* ===== ৪। এডমিন গেট (তালিকা) ===== */
function adminGate(){
let ap=localStorage.getItem('takrim_admin_pass');
if(!ap){let np=prompt('প্রথমবার: এডমিন পাসওয়ার্ড সেট করুন\n(এডমিন আইডি: takrim)');
if(!np)return;localStorage.setItem('takrim_admin_pass',np);alert('✔️ এডমিন পাসওয়ার্ড সেট হয়েছে');openListScr();return;}
let id=prompt('🔐 এডমিন আইডি দিন');
if(id!=='takrim'){alert('❌ অনুমতি নেই!');return;}
let pw=prompt('🔐 এডমিন পাসওয়ার্ড দিন');
if(pw!==ap){alert('❌ ভুল পাসওয়ার্ড!');return;}
openListScr();}
function openListScr(){show('listScr');
let seen={},uniq=[];
insts.forEach((s,i)=>{let k=(s.eiin&&s.eiin.trim()?s.eiin.trim():'')||(s.name||'').trim().toLowerCase();
if(!seen[k]){seen[k]=1;uniq.push(i);}});
instList.innerHTML=uniq.length?uniq.map(i=>{let s=insts[i];
return '<div class="card" style="display:flex;align-items:center;gap:10px;padding:10px;margin:0 0 10px">'+(s.logo?'<img src="'+s.logo+'" style="width:45px;height:45px;border-radius:50%;object-fit:cover">':'🏫')+'<div style="flex:1"><b>'+s.name+'</b><br><small>EIIN: '+(s.eiin||'-')+' | Code: '+(s.code||'-')+'<br>🔑 পাসওয়ার্ড: <span id="pw_'+i+'" style="font-weight:bold;color:#0f2d5a">'+(s.pass||'-')+'</span> <button class="pa" style="padding:2px 8px;font-size:14px" onclick="togglePw('+i+')">👁️</button></small></div><button class="pa a-on" style="font-size:18px" onclick="delInst('+i+')">🗑️</button></div>';}).join(''):'<p style="text-align:center;color:#888">এখনো কোনো প্রতিষ্ঠান নেই</p>';}
function togglePw(i){let el=document.getElementById('pw_'+i);
if(el.dataset.hide==='1'){el.textContent=insts[i].pass||'-';el.dataset.hide='';}
else{el.dataset.hide='1';el.textContent='••••••';}}
function delInst(idx){
if(!confirm('এই প্রতিষ্ঠান ডিলিট করবেন?'))return;
let s=insts[idx];
if(s.code&&users[s.code]){delete users[s.code];localStorage.setItem('takrim_users',JSON.stringify(users));}
insts.splice(idx,1);localStorage.setItem('takrim_insts',JSON.stringify(insts));
alert('✔️ প্রতিষ্ঠান ডিলিট হয়েছে');openListScr();}

/* ===== হাজিরা সিস্টেম (ফিক্সড - আগের মতো) ===== */
let currentClass="";
let students=[],attendance={},attMonthly={},results={};
let subNames=["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"];
let currentFilter='none';
function key(n){return n+'_'+currentClass;}
function loadClassData(){
  students=JSON.parse(localStorage.getItem(key('students'))||'[]');
  attendance=JSON.parse(localStorage.getItem(key('att'))||'{}');
  attMonthly=JSON.parse(localStorage.getItem(key('attMonthly'))||'{}');
  results=JSON.parse(localStorage.getItem(key('results'))||'{}');
  subNames=JSON.parse(localStorage.getItem(key('subNames'))||'["বিষয় 1","বিষয় 2","বিষয় 3","বিষয় 4","বিষয় 5","বিষয় 6","বিষয় 7","বিষয় 8","বিষয় 9","বিষয় 10","বিষয় 11","বিষয় 12","বিষয় 13"]');
}
function saveAll(){
  if(!currentClass)return;
  localStorage.setItem(key('students'),JSON.stringify(students));
  localStorage.setItem(key('att'),JSON.stringify(attendance));
  localStorage.setItem(key('attMonthly'),JSON.stringify(attMonthly));
  localStorage.setItem(key('results'),JSON.stringify(results));
  localStorage.setItem(key('subNames'),JSON.stringify(subNames));
}
function getMonthInfo(){let d=new Date();let y=d.getFullYear(),m=d.getMonth();return{monthName:d.toLocaleString('bn-BD',{month:'long',year:'numeric'}),days:new Date(y,m+1,0).getDate(),key:y+'-'+m,today:d.getDate()};}
function saveBox(){let info={nameBn:boxNameBn.innerText.trim(),nameEn:boxNameEn.innerText.trim(),eiin:boxEIIN.innerText.trim(),ins:boxIns.innerText.trim(),logo:boxLogo.src};localStorage.setItem('collegeInfo',JSON.stringify(info));boxStatus.innerText="✅ সেভ হয়েছে";setTimeout(()=>boxStatus.innerText="",1200);boxNameBn3.innerText=info.nameBn;boxNameEn3.innerText=info.nameEn;boxEIIN3.innerText="EIIN: "+info.eiin;boxIns3.innerText="Code: "+info.ins;boxLogo3.src=info.logo;}
function changeBoxLogo(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{boxLogo.src=e.target.result;saveBox();};r.readAsDataURL(f);}
function loadBox(){let info=JSON.parse(localStorage.getItem('collegeInfo')||'{}');if(info.nameBn)boxNameBn.innerText=info.nameBn;if(info.nameEn)boxNameEn.innerText=info.nameEn;if(info.eiin)boxEIIN.innerText=info.eiin;if(info.ins)boxIns.innerText=info.ins;if(info.logo){boxLogo.src=info.logo;boxLogo3.src=info.logo;}boxNameBn3.innerText=info.nameBn||boxNameBn.innerText;boxNameEn3.innerText=info.nameEn||boxNameEn.innerText;boxEIIN3.innerText="EIIN: "+(info.eiin||boxEIIN.innerText);boxIns3.innerText="Code: "+(info.ins||boxIns.innerText);}
function openStudentPage(){show('secondPage');loadBox();updateCounts();document.getElementById('studentList').style.display='none';document.getElementById('studentList').classList.remove('show');document.getElementById('resultDiv').style.display='none';currentFilter='none';}
function toggleAdd(){let f=document.getElementById('addForm');f.style.display=f.style.display=='none'?'block':'none';}
function addStudent(){if(!sName.value.trim())return alert('নাম দিন');students.push({name:sName.value.trim(),roll:sRoll.value.trim(),mobile:sMobile.value.trim()});saveAll();document.getElementById('addForm').style.display='none';sName.value='';sRoll.value='';sMobile.value='';filterList('all');}
function toggleAtt(i,isP){attendance[i]=isP?'present':'absent';let {key:mk,today}=getMonthInfo();if(!attMonthly[mk])attMonthly[mk]={};if(!attMonthly[mk][i])attMonthly[mk][i]={};attMonthly[mk][i][today]=isP?'P':'A';saveAll();render();updateCounts();}
function updateCounts(){let p=0;students.forEach((_,i)=>{if(attendance[i]!=='absent')p++;});document.getElementById('cAll').innerText=students.length;document.getElementById('cPresent').innerText=p;document.getElementById('cAbsent').innerText=students.length-p;}
function filterList(t){currentFilter=t;let sl=document.getElementById('studentList'),rd=document.getElementById('resultDiv');sl.style.display='none';rd.style.display='none';sl.classList.remove('show');if(t=='result'){rd.style.display='block';renderResult();}else{sl.style.display='block';sl.classList.add('show');render();}}
function render(){let sl=document.getElementById('studentList');sl.innerHTML='';students.forEach((s,i)=>{if(currentFilter=='present'&&attendance[i]=='absent')return;if(currentFilter=='absent'&&attendance[i]!=='absent')return;sl.innerHTML+=`<div class="student-row"><div><input type="checkbox" ${attendance[i]=='absent'?'':'checked'} onchange="toggleAtt(${i},this.checked)"> <b>${s.name}</b> (${s.roll})</div><div style="display:flex;gap:6px"><button onclick="editStudent(${i})" style="padding:6px 10px;border:none;border-radius:8px;background:#eab308;font-weight:bold">✏️</button><button onclick="deleteStudent(${i})" style="padding:6px 10px;border:none;border-radius:8px;background:#fee2e2">🗑️</button></div></div>`;});updateCounts();}
function deleteStudent(i){if(!confirm('ডিলিট করবেন?'))return;students.splice(i,1);saveAll();render();}
function editStudent(i){let s=students[i];let n=prompt('নাম:',s.name);if(n===null)return;let r=prompt('রোল:',s.roll);if(r===null)return;let m=prompt('মোবাইল:',s.mobile||'');if(m===null)return;students[i]={name:n.trim(),roll:r.trim(),mobile:m.trim()};saveAll();render();if(document.getElementById('monthlyDivFirst').style.display=='block')refreshMonthly();}
function toggleMonthAtt(idx,d){let {key:mk,today}=getMonthInfo();if(!attMonthly[mk])attMonthly[mk]={};if(!attMonthly[mk][idx])attMonthly[mk][idx]={};attMonthly[mk][idx][d]=attMonthly[mk][idx][d]=='P'?'A':'P';if(d==today){attendance[idx]=attMonthly[mk][idx][d]=='P'?'present':'absent';}saveAll();refreshMonthly();}
function refreshMonthly(){let div=document.getElementById('monthlyDivFirst');let {days,key:mk,today,monthName}=getMonthInfo();let h=`<h4 style="text-align:center;margin:5px 0">📅 ${monthName} - ${currentClass} - আজ ${today} তারিখ</h4><div style="overflow:auto;border:2px solid #2563eb;border-radius:10px"><table border="1" cellpadding="4" style="border-collapse:collapse;min-width:1400px;font-size:11px;text-align:center"><tr style="background:#0f3d2e;color:white"><th>নাম</th><th>রোল</th>`;for(let d=1;d<=days;d++)h+=`<th style="${d==today?'background:#ffcc00;color:#000':''}">${d}</th>`;h+=`<th>P</th><th>A</th></tr>`;students.forEach((s,idx)=>{if(!attMonthly[mk])attMonthly[mk]={};if(!attMonthly[mk][idx])attMonthly[mk][idx]={};let p=0,a=0;for(let d=1;d<=days;d++){if(attMonthly[mk][idx][d]=='P')p++;if(attMonthly[mk][idx][d]=='A')a++;}h+=`<tr><td style="text-align:left">${s.name}</td><td>${s.roll}</td>`;for(let d=1;d<=days;d++){let st=attMonthly[mk][idx][d]||'-';h+=`<td onclick="toggleMonthAtt(${idx},${d})" style="cursor:pointer;${d==today?'background:#fef9c3;font-weight:bold':''}">${st}</td>`;}h+=`<td>${p}</td><td>${a}</td></tr>`;});h+=`</table></div><button onclick="exportMonthlyFull()" style="width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:10px;margin-top:8px;font-weight:bold">⬇️ Excel ডাউনলোড (${currentClass})</button>`;div.innerHTML=h;}
function toggleMonthlyFirst(){let div=document.getElementById('monthlyDivFirst');if(div.style.display=='block'){div.style.display='none';return;}div.style.display='block';refreshMonthly();}
function exportMonthlyFull(){let {monthName,days,key:mk}=getMonthInfo();let header=["ক্রমিক","নাম","রোল"];for(let d=1;d<=days;d++)header.push(d+" তারিখ");header.push("মোট P","মোট A");let data=students.map((s,idx)=>{let row={"ক্রমিক":idx+1,"নাম":s.name,"রোল":s.roll};let p=0,a=0;for(let d=1;d<=days;d++){let st=(attMonthly[mk][idx]&&attMonthly[mk][idx][d])||'';row[d+" তারিখ"]=st;if(st=='P')p++;if(st=='A')a++;}row["মোট P"]=p;row["মোট A"]=a;return row;});let ws=XLSX.utils.json_to_sheet(data,{header:header});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,monthName);XLSX.writeFile(wb,`Hazira_${currentClass}_${monthName}.xlsx`);}
function renderResult(){let h=`<div style="overflow:auto"><table border="1" cellpadding="4" style="border-collapse:collapse;min-width:1600px;font-size:11px;text-align:center"><tr style="background:#0f3d2e;color:white"><th>ক্রম</th><th>নাম</th><th>রোল</th>`;for(let i=0;i<13;i++){let v=subNames[i].startsWith('বিষয়')?'':subNames[i];h+=`<th><input value="${v}" placeholder="বিষয় ${i+1}" oninput="subNames[${i}]=this.value||'বিষয় '+( ${i}+1 );saveAll()" style="width:80px;padding:4px;border-radius:6px;border:1px solid #ccc;text-align:center;font-weight:bold"></th>`;}h+=`<th style="background:#ffcc00;color:#000">মোট</th><th style="background:#16a34a;color:#fff">জিপিএ</th></tr>`;students.forEach((s,idx)=>{let r=results[idx]||{};h+=`<tr><td>${idx+1}</td><td style="text-align:left">${s.name}</td><td>${s.roll}</td>`;for(let i=0;i<13;i++)h+=`<td><input type="number" min="0" max="100" value="${r['s'+i]||''}" oninput="if(!results[${idx}])results[${idx}]={};results[${idx}]['s'+${i}]=this.value;saveAll();renderResult()" style="width:55px;padding:4px;text-align:center"></td>`;let t=0,c=0;for(let i=0;i<13;i++){let mv=(results[idx]||{})['s'+i];if(mv!==''&&mv!==undefined){t+=parseInt(mv);c++;}}let gpa=c?Math.min(5,(t/c/20)).toFixed(2):'0.00';h+=`<td style="font-weight:bold;background:#fef9c3">${t}</td><td style="font-weight:bold;background:#dcfce7">${gpa}</td></tr>`;});h+=`</table></div><button onclick="exportResult()" style="width:100%;margin-top:10px;padding:12px;background:#16a34a;color:white;border:none;border-radius:10px;font-weight:bold">⬇️ রেজাল্ট Excel ডাউনলোড</button>`;document.getElementById('resultDiv').innerHTML=h;}
function exportResult(){let header=["ক্রম","নাম","রোল"];for(let i=0;i<13;i++)header.push(subNames[i].startsWith('বিষয়')?'বিষয় '+(i+1):subNames[i]);header.push("মোট","জিপিএ");let data=students.map((s,idx)=>{let r=results[idx]||{};let row={"ক্রম":idx+1,"নাম":s.name,"রোল":s.roll};let t=0,c=0;for(let i=0;i<13;i++){let v=r['s'+i]||'';row[header[3+i]]=v;if(v!==''){t+=parseInt(v);c++;}}row["মোট"]=t;row["জিপিএ"]=c?Math.min(5,(t/c/20)).toFixed(2):'0.00';return row;});let ws=XLSX.utils.json_to_sheet(data,{header:header});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Result");XLSX.writeFile(wb,`Result_${currentClass}.xlsx`);}
function sendDirectSMS(type){let {monthName,today}=getMonthInfo();let date=`${today} ${monthName}`;let school=document.getElementById('boxNameBn').innerText.trim();let numbers=[];let msg="";students.forEach((s,i)=>{let absent=attendance[i]=='absent';if(type=='present'&&!absent&&s.mobile)numbers.push(s.mobile);if(type=='absent'&&absent&&s.mobile)numbers.push(s.mobile);if(type=='notice'&&s.mobile)numbers.push(s.mobile);});if(type=='notice'){let n=document.getElementById('noticeText').value||'নোটিশ';msg=`📢 ${school} (${currentClass}): ${n}`;window.location.href=`sms:?body=${encodeURIComponent(msg)}`;return;}if(!numbers.length)return alert('নাম্বার নেই!');if(type=='present')msg=`আপনার সন্তান আজ ${date} ${school} এ উপস্থিত আছে।`;if(type=='absent')msg=`আপনার সন্তান আজ ${date} ${school} এ অনুপস্থিত আছে।`;window.location.href=`sms:${numbers.join(',')}?body=${encodeURIComponent(msg)}`;}
function sendWA(type){
  let {monthName,today}=getMonthInfo();
  let date=`${today} ${monthName}`;
  let school=document.getElementById('boxNameBn').innerText.trim();
  if(type=='notice'){
    let n=document.getElementById('noticeText').value||'নোটিশ';
    window.open(`https://wa.me/?text=${encodeURIComponent(`📢 ${school} (${currentClass}): ${n}`)}`,'_blank');
    return;
  }
  let list=students.filter((s,i)=> type=='present'? attendance[i]!=='absent' : attendance[i]=='absent');
  if(!list.length) return alert(type=='present'?'উপস্থিত কেউ নেই!':'অনুপস্থিত কেউ নেই!');
  let e=type=='present'?'✅':'❌', l=type=='present'?'উপস্থিত':'অনুপস্থিত';
  let msg=`${e} *${l} তালিকা*\n🏫 ${school}\n📚 ${currentClass} | ${date}\n\n${list.map(s=>'• '+s.name+' ('+s.roll+')').join('\n')}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}
function shareReport(){let {monthName,today}=getMonthInfo();let present=students.filter((s,i)=>attendance[i]!=='absent');let absent=students.filter((s,i)=>attendance[i]=='absent');let msg=`📊 *হাজিরা রিপোর্ট*\n🏫 ${document.getElementById('boxNameBn').innerText}\n📚 ${currentClass} | ${today} ${monthName}\n\n✅ উপস্থিত (${present.length} জন):\n${present.map(s=>'• '+s.name).join('\n')}\n\n❌ অনুপস্থিত (${absent.length} জন):\n${absent.length?absent.map(s=>'• '+s.name).join('\n'):'কেউ না'}`;window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');}
function fixDateBug(){let {key:mk,today}=getMonthInfo();if(!attMonthly[mk])return;Object.keys(attMonthly[mk]).forEach(idx=>{let d=attMonthly[mk][idx];if(d[1]&&!d[today]){d[today]=d[1];delete d[1];}});saveAll();}
window.onload=()=>{loadBox();updateSelInfo();};
</script>
