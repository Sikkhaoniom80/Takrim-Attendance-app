<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ডিজিটাল হাজিরা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:'Hind Siliguri',sans-serif}
body{margin:0;background:#0a2342;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:12px}
.card{background:white;margin:20px 12px 15px;border-radius:18px;padding:15px;width:100%;max-width:420px;display:none}
.card.active{display:block;animation:fadeIn.3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.yellow-btn{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;cursor:pointer;font-size:16px}
select,input{width:100%;padding:14px;border-radius:14px;border:1.5px solid #ccc;font-size:16px;margin:6px 0;background:white}
</style>
</head>
<body>

<div id="homePage" class="card active" style="text-align:center">
<div style="font-size:55px">🏫</div>
<h2>ডিজিটাল হাজিরা</h2>
<button class="yellow-btn" onclick="show('addInstPage')">➕ নতুন প্রতিষ্ঠান যোগ করুন</button>
<button class="yellow-btn" style="margin-top:10px" onclick="show('loginPage')">🔑 প্রতিষ্ঠান লগইন</button>
<button class="yellow-btn" style="margin-top:10px" onclick="show('instListPage')">📋 প্রতিষ্ঠান তালিকা দেখুন</button>
</div>

<div id="addInstPage" class="card">
<h3>নতুন প্রতিষ্ঠান</h3>
<div onclick="npLogoInput.click()" style="text-align:center;cursor:pointer"><img id="npLogo" src="https://via.placeholder.com/100" style="width:100px;height:100px;border-radius:50%;border:3px solid #ffcc00"><div style="font-size:12px;color:blue">লোগো বাছুন</div><input type="file" id="npLogoInput" accept="image/*" style="display:none" onchange="npLogoChg(this)"></div>
<input id="npBn" placeholder="বাংলা নাম"><input id="npEn" placeholder="English Name"><input id="npEi" placeholder="EIIN"><input id="npCd" placeholder="প্রতিষ্ঠান কোড"><input id="npPass" type="password" placeholder="পাসওয়ার্ড সেট করুন">
<button class="yellow-btn" onclick="saveNewInst()">✔️ সেভ করুন</button>
<button class="yellow-btn" style="background:#ddd;margin-top:8px" onclick="show('homePage')">⬅️ হোম</button>
</div>

<div id="loginPage" class="card">
<h3>প্রতিষ্ঠান লগইন</h3>
<select id="l_inst"></select>
<select id="l_class"></select>
<input id="l_code" placeholder="প্রতিষ্ঠান কোড"><input id="l_pass" type="password" placeholder="পাসওয়ার্ড">
<button class="yellow-btn" onclick="teacherLogin()">প্রবেশ করুন ➜</button>
<button class="yellow-btn" style="background:#ddd;margin-top:8px" onclick="show('homePage')">⬅️ হোম</button>
<p id="l_msg" style="color:red"></p>
</div>

<div id="instListPage" class="card">
<h3>প্রতিষ্ঠান তালিকা</h3>
<input id="adminPass" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড (admin123)">
<button class="yellow-btn" onclick="adminGate()">দেখুন</button>
<div id="instTable"></div>
<button class="yellow-btn" style="background:#ddd;margin-top:8px" onclick="show('homePage')">⬅️ হোম</button>
</div>

<script>
let insts=JSON.parse(localStorage.getItem('takrim_insts')||'[]');
let users=JSON.parse(localStorage.getItem('takrim_users')||'{}');
const LCLASSES=["১ম শ্রেণি","২য় শ্রেণি","৩য় শ্রেণি","৪র্থ শ্রেণি","৫ম শ্রেণি","৬ষ্ঠ শ্রেণি","৭ম শ্রেণি","৮ম শ্রেণি","৯ম শ্রেণি","১০ম শ্রেণি"];
function show(id){document.querySelectorAll('.card').forEach(c=>c.classList.remove('active'));document.getElementById(id).classList.add('active');window.scrollTo(0,0);}
function fillLogin(){l_inst.innerHTML=insts.map((s,i)=>'<option value="'+i+'">'+s.name+'</option>').join('');l_class.innerHTML=LCLASSES.map(c=>'<option>'+c+'</option>').join('');}
function npLogoChg(i){let r=new FileReader();r.onload=e=>npLogo.src=e.target.result;r.readAsDataURL(i.files[0]);}
function saveNewInst(){let bn=npBn.value.trim(),cd=npCd.value.trim(),pw=npPass.value;if(!bn||!cd||!pw)return alert('নাম, কোড ও পাসওয়ার্ড দিন!');if(insts.find(x=>x.code==cd))return alert('এই কোডে প্রতিষ্ঠান আছে!');insts.push({name:bn,en:npEn.value.trim(),eiin:npEi.value.trim(),code:cd,logo:npLogo.src,pass:pw});users[cd]=pw;localStorage.setItem('takrim_insts',JSON.stringify(insts));localStorage.setItem('takrim_users',JSON.stringify(users));npBn.value=npEn.value=npEi.value=npCd.value=npPass.value='';npLogo.src='https://via.placeholder.com/100';fillLogin();alert('✔️ সেভ হয়েছে!');show('homePage');}
function teacherLogin(){let s=insts[+l_inst.value];let cd=l_code.value.trim(),pw=l_pass.value;let cl=l_class.value;let ok=(s&&s.code==cd&&s.pass==pw)||(users[cd]&&users[cd]==pw);if(!ok){l_msg.innerText='❌ ভুল কোড বা পাসওয়ার্ড!';return;}localStorage.setItem('collegeInfo',JSON.stringify({nameBn:s?s.name:'',nameEn:s?s.en:'',eiin:s?s.eiin:'',ins:s?s.code:'',logo:s?s.logo:''}));localStorage.setItem('takrim_current',cl);localStorage.setItem('takrim_current_class',cl);localStorage.setItem('takrim_session','1');location.href='dashboard.html';}
function adminGate(){if(adminPass.value!=='admin123')return alert('ভুল পাসওয়ার্ড!');openListScr(true);}
function openListScr(ok){if(!ok)return;let h='<table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:10px"><tr style="background:#0f3d2e;color:#fff"><th style="padding:8px;border:1px solid #ccc">নাম</th><th style="padding:8px;border:1px solid #ccc">কোড</th><th style="padding:8px;border:1px solid #ccc">পাসওয়ার্ড</th><th style="padding:8px;border:1px solid #ccc">🗑️</th></tr>';insts.forEach((s,i)=>{h+='<tr><td style="padding:8px;border:1px solid #ccc">'+s.name+'</td><td style="padding:8px;border:1px solid #ccc">'+s.code+'</td><td style="padding:8px;border:1px solid #ccc"><span>•••••• </span><button onclick="togglePw('+i+',this)" style="border:none;background:#eee;border-radius:6px;cursor:pointer">👁️</button></td><td style="padding:8px;border:1px solid #ccc;text-align:center"><button onclick="delInst('+i+')" style="border:none;background:#fee2e2;border-radius:6px;cursor:pointer">🗑️</button></td></tr>';});h+='</table>';instTable.innerHTML=h;}
function togglePw(i,btn){let sp=btn.parentElement.querySelector('span');sp.textContent=sp.textContent.trim()=='••••••'?insts[i].pass+' ':'•••••• ';}
function delInst(i){if(!confirm('ডিলিট করবেন?'))return;let cd=insts[i].code;insts.splice(i,1);delete users[cd];localStorage.setItem('takrim_insts',JSON.stringify(insts));localStorage.setItem('takrim_users',JSON.stringify(users));fillLogin();openListScr(true);}
fillLogin();
</script>
</body>
</html>
