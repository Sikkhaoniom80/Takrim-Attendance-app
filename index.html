<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>তাকরিম শিক্ষা নিকেতন - হাজিরা</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#1a5c3a,#2d8a52);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{background:#fff;border-radius:20px;padding:40px 30px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.badge{width:110px;height:110px;margin:0 auto 15px;background:linear-gradient(135deg,#1a5c3a,#2d8a52);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff}
h1{color:#1a5c3a;font-size:24px;margin-bottom:5px}
.subtitle{color:#888;margin-bottom:25px;font-size:14px}
.btn{display:block;background:linear-gradient(135deg,#1a5c3a,#2d8a52);color:#fff;padding:15px;border-radius:12px;text-decoration:none;font-size:17px;font-weight:bold;margin:10px 0;cursor:pointer;border:none;width:100%}
.btn.secondary{background:#f0f0f0;color:#1a5c3a}
</style>
</head>
<body>
<div class="container">
<div class="badge">🎓</div>
<h1>তাকরিম শিক্ষা নিকেতন</h1>
<p class="subtitle">ডিজিটাল হাজিরা ব্যবস্থাপনা</p>
<button class="btn" onclick="adminLogin()">🔐 শিক্ষক লগইন</button>
<a class="btn secondary" href="students.html">👥 ছাত্র তালিকা</a>
<a class="btn secondary" href="reports.html">📊 রিপোর্ট</a>
</div>
<script>
function adminLogin(){
  var id = prompt("🔐 এডমিন আইডি দিন:");
  if(id === null) return;
  if(id.trim() !== "malek"){ alert("❌ ভুল এডমিন আইডি!"); return; }
  var pw = prompt("🔑 পাসওয়ার্ড দিন:");
  if(pw === null) return;
  if(pw !== "malek1980"){ alert("❌ ভুল পাসওয়ার্ড!"); return; }
  alert("✅ স্বাগতম!");
  window.location.href = "dashboard.html";
}
</script>
</body>
</html>
